<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tee Sheet</title>
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tee Sheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; tee times read like a starter's board; every edit happens in a bottom sheet within thumb reach */
:root {
	--bg: #F2F4EF;
	--surface: #FFFFFF;
	--surface-2: #E8ECE4;
	--line: #D3DBCF;
	--ink: #16221B;
	--ink-2: #5A685F;
	--accent: #1C3B61;
	--accent-ink: #FFFFFF;
	--accent-soft: #DCE5F0;
	--in: #2B7A43;
	--in-bg: #DFF0E4;
	--pending: #9A6105;
	--pending-bg: #FAEDD0;
	--out: #A23F37;
	--out-bg: #F6E1DE;
	--scrim: rgba(14, 22, 17, .45);
	--shadow: 0 1px 2px rgba(22, 34, 27, .06), 0 4px 14px rgba(22, 34, 27, .06);
	--font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
	--font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
	--radius: 14px;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #0E1511; --surface: #17201B; --surface-2: #1F2A23; --line: #2D3B32; --ink: #E5ECE6; --ink-2: #9AA99F;
		--accent: #93B7E3; --accent-ink: #0B1626; --accent-soft: #1C2B3E; --in: #6FC48B; --in-bg: #173020; --pending: #E8B65A; --pending-bg: #33270E;
		--out: #E58D83; --out-bg: #3A1C19; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #0E1511; --surface: #17201B; --surface-2: #1F2A23; --line: #2D3B32; --ink: #E5ECE6; --ink-2: #9AA99F;
	--accent: #93B7E3; --accent-ink: #0B1626; --accent-soft: #1C2B3E; --in: #6FC48B; --in-bg: #173020; --pending: #E8B65A; --pending-bg: #33270E;
	--out: #E58D83; --out-bg: #3A1C19; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
	color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
body {
	margin: 0;
	padding-top: env(safe-area-inset-top, 0px);
	background: var(--bg);
	color: var(--ink);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.4;
	-webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 112px; }

.top {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 10;
	background: var(--bg);
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	padding-block: 14px 10px;
	border-bottom: 1px solid var(--line);
	margin-bottom: 16px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--ink-2); }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px 0 2px; border: 0; background: none; font-weight: 600; color: var(--accent); }
.back svg { width: 20px; height: 20px; }
.link-btn { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; color: var(--accent); }

.notice { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; margin-bottom: 16px; }
.notice button { border: 0; background: none; padding: 6px 0; font-weight: 600; color: var(--accent); min-height: 36px; }

.section-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-block: 22px 10px; display: flex; justify-content: space-between; align-items: center; }
.section-label:first-child { margin-top: 0; }
.section-label button { border: 0; background: none; font: inherit; color: var(--accent); letter-spacing: .08em; min-height: 36px; }

.cards { display: grid; gap: 10px; }
.card {
	width: 100%;
	display: grid;
	grid-template-columns: 58px minmax(0, 1fr);
	gap: 14px;
	align-items: start;
	text-align: left;
	padding: 14px;
	border: 1px solid var(--line);
	border-radius: var(--radius);
	background: var(--surface);
	box-shadow: var(--shadow);
}
.card.past { box-shadow: none; background: transparent; }
.card.past .cal { opacity: .7; }
.cal { display: grid; justify-items: center; padding: 6px 0 8px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-display); line-height: 1; }
.cal-dow { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); }
.cal-day { font-size: 30px; font-weight: 700; margin-block: 2px; font-variant-numeric: tabular-nums; }
.cal-mon { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); }
.card-body { min-width: 0; display: grid; gap: 6px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-title { font-weight: 600; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.card-when { flex: none; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.card-times { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.card-times.none { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--ink-2); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.in { background: var(--in-bg); color: var(--in); }
.chip.pending { background: var(--pending-bg); color: var(--pending); }
.chip.out { background: var(--out-bg); color: var(--out); }
.chip.tag { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }

.meter { display: flex; flex-wrap: wrap; gap: 8px; }
.meter-group { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.in { background: var(--in); border-color: var(--in); }
.dot.pending { border-color: var(--pending); background: var(--pending-bg); }
.dot.over { border-color: var(--out); background: var(--out); }

.empty { text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); display: grid; gap: 6px; }
.empty strong { color: var(--ink); font-size: 17px; }

/* Round detail */
.course { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .01em; overflow-wrap: anywhere; }
.when { color: var(--ink-2); margin-top: 4px; }
.notes { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.stat { padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.stat.in b { color: var(--in); }
.stat.pending b { color: var(--pending); }
.stat.out b { color: var(--out); }
.stat.over b { color: var(--out); }

.tee, .list-card { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tee-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface-2); }
.tee-time { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.tee-time small { font-size: 16px; font-weight: 600; margin-left: 3px; letter-spacing: .05em; color: var(--ink-2); }
.tee-label { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.tee-fill { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tee-fill.over { color: var(--out); font-weight: 600; }
.slots { list-style: none; margin: 0; padding: 0; }
.slots li + li { border-top: 1px solid var(--line); }
.player { display: flex; align-items: center; gap: 8px; padding-inline: 4px 10px; }
.p-main { flex: 1; min-width: 0; display: grid; align-content: center; gap: 1px; text-align: left; padding: 10px; min-height: 52px; border: 0; background: none; }
.p-name { font-weight: 600; overflow-wrap: anywhere; }
.player.is-out .p-name { text-decoration: line-through; text-decoration-color: var(--ink-2); color: var(--ink-2); }
.p-sub { font-size: 13px; color: var(--ink-2); }
.p-note { justify-self: start; margin-top: 4px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--ink); font-size: 14px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.p-note::before { content: '✎ '; color: var(--ink-2); }
.player.is-out .p-note { text-decoration: none; }
textarea.input.note-box { min-height: 64px; }
.pill { flex: none; min-width: 88px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.in { background: var(--in-bg); color: var(--in); }
.pill.pending { background: var(--pending-bg); color: var(--pending); border-color: var(--pending); border-style: dashed; }
.pill.pending::before { background: transparent; border: 1.5px solid currentColor; width: 7px; height: 7px; }
.pill.out { background: var(--out-bg); color: var(--out); }
.pill.league-toggle { min-width: 112px; background: transparent; color: var(--ink-2); border: 1.5px dashed var(--line); }
.pill.league-toggle::before { background: transparent; border: 1.5px solid currentColor; width: 7px; height: 7px; }
.pill.league-toggle.on { background: var(--accent-soft); color: var(--accent); border: 1.5px solid transparent; }
.pill.league-toggle.on::before { background: currentColor; border: 0; width: 8px; height: 8px; }
.league { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; }
.page-head { margin-bottom: 16px; }
.picker { margin-top: 0; }
.pick-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; background: none; text-align: left; }
.pick-row.on { background: var(--accent-soft); }
.tick { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; }
.pick-row.on .tick { background: var(--accent); border-color: var(--accent); }
.pick-row.on .tick::after { content: ''; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.pick-text { min-width: 0; display: grid; gap: 1px; }
.open-slot { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 0; background: none; color: var(--ink-2); text-align: left; }
.open-slot .plus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.open-slot:hover .plus { border-color: var(--accent); color: var(--accent); }
.grip { flex: none; align-self: stretch; width: 30px; margin-right: -6px; display: grid; place-items: center; color: var(--ink-2); opacity: .55; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.grip:hover { opacity: 1; }
.player.is-dragging { opacity: .3; }
.drag-ghost { position: fixed; z-index: 70; margin: 0; list-style: none; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .22); transform: scale(1.02); opacity: .9; }
.drag-ghost .grip { opacity: 1; cursor: grabbing; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }
.player.drop-target { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.tee.drop-target { box-shadow: 0 0 0 2px var(--accent); }
.drop-only { display: none; }
body.is-dragging .drop-only { display: block; }
.drop-hint { margin: 0; padding: 14px; color: var(--ink-2); font-size: 14px; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

.row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.ghost { min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; color: var(--accent); padding: 0 12px; }

/* Bottom action bar */
.bar {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 20;
	padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
	background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar-inner { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; }
.primary { flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; box-shadow: var(--shadow); }
.secondary { min-height: 52px; padding: 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }
.danger-btn { min-height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--out); font-weight: 600; }
.danger-btn.armed { background: var(--out); border-color: var(--out); color: var(--surface); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet {
	position: relative;
	width: 100%;
	max-width: 560px;
	max-height: 90vh;
	max-height: 90dvh;
	overflow-y: auto;
	overflow-x: hidden;
	overscroll-behavior: contain;
	background: var(--surface);
	border-radius: 20px 20px 0 0;
	padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px));
	animation: rise .22s ease-out;
}
.sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) {
	.sheet-wrap { align-items: center; }
	.sheet { border-radius: 20px; padding-bottom: 20px; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; line-height: 1; color: var(--ink-2); }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.input, select.input, textarea.input {
	width: 100%;
	min-height: 48px;
	padding: 10px 12px;
	border: 1px solid var(--line);
	border-radius: 10px;
	background: var(--bg);
	font-size: 16px;
}
textarea.input { min-height: 80px; resize: vertical; }
.input[type="date"], .input[type="time"] {
	-webkit-appearance: none;
	appearance: none;
	display: block;
	min-width: 0;
	max-width: 100%;
	text-align: left;
}
.input::-webkit-date-and-time-value { text-align: left; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { min-height: 46px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 10px; font-weight: 600; cursor: pointer; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input[value="in"]:checked + label { background: var(--in-bg); border-color: var(--in); color: var(--in); }
.seg input[value="pending"]:checked + label { background: var(--pending-bg); border-color: var(--pending); color: var(--pending); }
.seg input[value="out"]:checked + label { background: var(--out-bg); border-color: var(--out); color: var(--out); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg input[value="booked"]:checked + label { background: var(--in-bg); border-color: var(--in); color: var(--in); }
.seg input[value="tentative"]:checked + label { background: var(--pending-bg); border-color: var(--pending); border-style: dashed; color: var(--pending); }
.chip.tentative { background: transparent; color: var(--pending); border: 1.5px dashed var(--pending); padding: 1px 8px; }
.tentative-note { margin: 12px 0 0; background: var(--pending-bg); border: 1.5px dashed var(--pending); color: var(--ink); }
.times { display: grid; gap: 8px; }
.time-row { display: flex; gap: 8px; }
.time-row .input { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.time-row .x { flex: none; width: 48px; height: 48px; border-radius: 10px; }
.add-time { min-height: 44px; border: 1.5px dashed var(--line); border-radius: 10px; background: none; color: var(--accent); font-weight: 600; }
.checks { display: grid; margin-top: -8px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.sheet-actions { display: grid; gap: 10px; margin-top: 4px; }
.sheet-actions.two { grid-template-columns: 1fr 1fr; }
.sheet-actions .primary, .sheet-actions .secondary { box-shadow: none; }
.sheet-actions.two .secondary { order: -1; }
.sheet-actions.sticky { position: sticky; bottom: 0; z-index: 1; padding-block: 10px; background: var(--surface); border-top: 1px solid var(--line); }
.primary[disabled] { opacity: .5; }
.text-btn { justify-self: start; min-height: 40px; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
.message-box { min-height: 96px; line-height: 1.45; }
.err { color: var(--out); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: 15px; box-shadow: var(--shadow); }
.foot { margin-top: 28px; font-size: 13px; color: var(--ink-2); text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
.foot button { border: 0; background: none; padding: 8px 4px; font-weight: 600; font-size: 13px; color: var(--accent); }

.auth { display: grid; gap: 20px; padding-top: 12vh; }
.auth .form { padding: 18px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
</style>
</head>
<body>

<div class="app">
	<header class="top" id="top"></header>
	<main id="main"></main>
	<p class="foot" id="foot"></p>
</div>
<div class="bar" id="bar"><div class="bar-inner" id="barInner"></div></div>
<div class="sheet-wrap" id="sheetWrap" hidden>
	<div class="scrim" data-action="close-sheet"></div>
	<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SLOTS_PER_TEE = 4;
const OWNER_NAME = window.TEE_SHEET_CONFIG?.ownerName || 'Me';
const STATUS_LABEL = {in: 'In', pending: 'Pending', out: 'Out'};
const NEXT_STATUS = {pending: 'in', in: 'out', out: 'pending'};
const STATUS_ORDER = {in: 0, pending: 1, out: 2};

let rounds = [];
let regulars = [];
let loaded = false;
let storeMode = 'loading';
let sb = null;
let userId = null;
let userEmail = '';
let channel = null;
const deletedKeys = new Set();
let view = {name: 'list', roundId: null};
let showPast = false;
let sheet = null;
let drag = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');

function todayStr() {
	const d = new Date();
	return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function parseDate(s) {
	const [y, m, d] = s.split('-').map(Number);
	return new Date(y, m - 1, d);
}
function daysUntil(s) {
	return Math.round((parseDate(s) - parseDate(todayStr())) / 86400000);
}
function relDay(s) {
	const n = daysUntil(s);
	if (n === 0) return 'Today';
	if (n === 1) return 'Tomorrow';
	if (n === -1) return 'Yesterday';
	if (n > 1 && n < 14) return `in ${n} days`;
	if (n >= 14) return `in ${Math.round(n / 7)} weeks`;
	if (n > -14) return `${-n} days ago`;
	return `${Math.round(-n / 7)} weeks ago`;
}
function fmtDate(s, opts) {
	return new Intl.DateTimeFormat(undefined, opts).format(parseDate(s));
}
function splitTime(t) {
	const [h, m] = t.split(':').map(Number);
	return {clock: `${h % 12 || 12}:${pad(m)}`, mer: h < 12 ? 'AM' : 'PM'};
}
function fmtTime(t) {
	const {clock, mer} = splitTime(t);
	return `${clock} ${mer}`;
}
function fmtTimes(teeTimes) {
	const parts = teeTimes.map(t => splitTime(t.time));
	const sameMer = parts.every(p => p.mer === parts[0].mer);
	if (sameMer) return parts.map(p => p.clock).join(' · ') + ' ' + parts[0].mer;
	return parts.map(p => `${p.clock} ${p.mer}`).join(' · ');
}
function addMinutes(t, mins) {
	const [h, m] = t.split(':').map(Number);
	const total = (h * 60 + m + mins) % 1440;
	return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
}
function firstTime(r) {
	return r.teeTimes?.[0]?.time ?? '99:99';
}
function byWhen(a, b) {
	return a.date.localeCompare(b.date) || firstTime(a).localeCompare(firstTime(b));
}

function normalize(r) {
	return {
		id: r.id,
		course: r.course || 'Untitled course',
		date: r.date || todayStr(),
		notes: r.notes || '',
		example: !!r.example,
		tentative: !!r.tentative,
		teeTimes: Array.isArray(r.teeTimes) ? [...r.teeTimes].sort((a, b) => a.time.localeCompare(b.time)) : [],
		players: (Array.isArray(r.players) ? r.players : []).map(p => (p.name === 'Me' ? {...p, name: OWNER_NAME} : p)),
		createdAt: r.createdAt || '',
		updatedAt: r.updatedAt || '',
	};
}
function findRound(id) {
	return rounds.find(r => r.id === id);
}
function counts(r) {
	const c = {in: 0, pending: 0, out: 0};
	r.players.forEach(p => c[p.status]++);
	const spots = r.teeTimes.length * SLOTS_PER_TEE;
	return {...c, spots, open: spots - c.in - c.pending};
}
function playersAt(r, teeId) {
	return r.players
		.filter(p => p.teeTimeId === teeId && p.status !== 'out')
		.sort(byStatusThenLeague);
}
function firstOpenTee(r) {
	const tee = r.teeTimes.find(t => playersAt(r, t.id).length < SLOTS_PER_TEE);
	return tee ? tee.id : '';
}
function nameOf(r, pid) {
	return r.players.find(p => p.id === pid)?.name ?? '';
}
function knownNames() {
	const freq = new Map();
	rounds.forEach(r => r.players.forEach(p => freq.set(p.name, (freq.get(p.name) || 0) + 1)));
	return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => n);
}
function knownCourses() {
	return [...new Set(rounds.map(r => r.course))].sort();
}

function normalizeRegular(g) {
	return {
		id: g.id,
		name: g.name || 'Unnamed',
		league: !!g.league,
		createdAt: g.createdAt || '',
		updatedAt: g.updatedAt || '',
	};
}
function sameName(a, b) {
	return a.trim().toLowerCase() === b.trim().toLowerCase();
}
function regularFor(p) {
	return regulars.find(g => g.id === p.regularId) || regulars.find(g => sameName(g.name, p.name));
}
function isLeague(p) {
	return !!regularFor(p)?.league;
}
function byStatusThenLeague(a, b) {
	return STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || isLeague(b) - isLeague(a);
}
function onRound(r, g) {
	return r.players.some(p => p.regularId === g.id || sameName(p.name, g.name));
}
function golferStats() {
	const stats = new Map();
	rounds.forEach(r => regulars.forEach(g => {
		const p = r.players.find(x => x.regularId === g.id || sameName(x.name, g.name));
		if (p?.status !== 'in') return;
		const s = stats.get(g.id) || {played: 0, last: ''};
		s.played++;
		if (r.date > s.last) s.last = r.date;
		stats.set(g.id, s);
	}));
	return g => stats.get(g.id) || {played: 0, last: ''};
}
function rankedRegulars() {
	const stats = golferStats();
	return [...regulars].sort((a, b) => stats(b).played - stats(a).played || stats(b).last.localeCompare(stats(a).last) || a.name.localeCompare(b.name));
}
function unsavedNames() {
	return knownNames().filter(n => !sameName(n, OWNER_NAME) && !sameName(n, 'Me') && !regulars.some(g => sameName(g.name, n)));
}

/* Storage: Supabase when configured and signed in, this browser otherwise */
const TABLES = {
	rounds: {lsKey: 'teesheet.rounds.v1', normalize, get: () => rounds, set: list => { rounds = list; }},
	regulars: {lsKey: 'teesheet.regulars.v1', normalize: normalizeRegular, get: () => regulars, set: list => { regulars = list; }},
};

function lsRead(table) {
	try {
		return (JSON.parse(localStorage.getItem(TABLES[table].lsKey)) || []).map(TABLES[table].normalize);
	} catch (readErr) {
		return [];
	}
}
function lsWrite(table) {
	try {
		localStorage.setItem(TABLES[table].lsKey, JSON.stringify(TABLES[table].get()));
	} catch (writeErr) {
		toast('Couldn’t save on this device.');
	}
}

const writeQueues = new Map();
function queueWrite(key, fn) {
	const q = writeQueues.get(key) || {running: false, next: null};
	q.next = fn;
	writeQueues.set(key, q);
	if (!q.running) drain(q);
}
async function drain(q) {
	q.running = true;
	while (q.next) {
		const fn = q.next;
		q.next = null;
		try {
			await fn();
		} catch (saveErr) {
			onWriteError(saveErr);
		}
	}
	q.running = false;
}
function onWriteError() {
	toast('Couldn’t save. Check your connection and try again.');
	fetchAll();
}
function isWriting(table, id) {
	return !!writeQueues.get(`${table}/${id}`)?.running;
}

function saveDoc(table, doc) {
	const now = new Date().toISOString();
	const next = TABLES[table].normalize({...doc, updatedAt: now, createdAt: doc.createdAt || now});
	const list = [...TABLES[table].get()];
	const idx = list.findIndex(d => d.id === next.id);
	if (idx === -1) list.push(next);
	else list[idx] = next;
	TABLES[table].set(list);
	render();
	if (storeMode === 'cloud') {
		const {id, ...data} = next;
		queueWrite(`${table}/${id}`, async () => {
			const {error} = await sb.from(table).upsert({id, user_id: userId, data, updated_at: data.updatedAt});
			if (error) throw error;
		});
	} else {
		lsWrite(table);
	}
}
function deleteDoc(table, id) {
	TABLES[table].set(TABLES[table].get().filter(d => d.id !== id));
	deletedKeys.add(`${table}/${id}`);
	render();
	if (storeMode === 'cloud') {
		queueWrite(`${table}/${id}`, async () => {
			const {error} = await sb.from(table).delete().eq('id', id);
			if (error) throw error;
		});
	} else {
		lsWrite(table);
	}
}

async function fetchTable(table) {
	const {data, error} = await sb.from(table).select('id, data');
	if (error) return false;
	const merged = new Map(data.map(row => [row.id, TABLES[table].normalize({id: row.id, ...row.data})]));
	TABLES[table].get().forEach(local => {
		const remote = merged.get(local.id);
		if ((remote && local.updatedAt > remote.updatedAt) || (!remote && isWriting(table, local.id))) merged.set(local.id, local);
	});
	merged.forEach((doc, id) => {
		if (deletedKeys.has(`${table}/${id}`)) merged.delete(id);
	});
	TABLES[table].set([...merged.values()]);
	return true;
}
async function fetchAll() {
	if (storeMode !== 'cloud') return;
	const results = await Promise.all(Object.keys(TABLES).map(fetchTable));
	loaded = true;
	if (results.includes(false)) toast('Couldn’t load everything. Check your connection and reopen the app.');
	render();
}
function applyChange(table, payload) {
	const list = TABLES[table].get();
	if (payload.eventType === 'DELETE') {
		const id = payload.old?.id;
		if (id && list.some(d => d.id === id) && !isWriting(table, id)) {
			TABLES[table].set(list.filter(d => d.id !== id));
			render();
		}
		return;
	}
	const row = payload.new;
	if (!row?.id || !row.data || deletedKeys.has(`${table}/${row.id}`)) return;
	const incoming = TABLES[table].normalize({id: row.id, ...row.data});
	const local = list.find(d => d.id === row.id);
	if (local && local.updatedAt >= incoming.updatedAt) return;
	TABLES[table].set([...list.filter(d => d.id !== row.id), incoming]);
	render();
}
function editRound(id, mutate) {
	const r = findRound(id);
	if (!r) return;
	const copy = structuredClone(r);
	mutate(copy);
	saveDoc('rounds', copy);
}

/* Rendering */
const icoBack = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

function render() {
	if (drag) return;
	if (storeMode === 'auth') {
		renderSignIn();
		return;
	}
	if (view.name === 'round' && !findRound(view.roundId) && loaded) view = {name: 'list', roundId: null};
	if (sheet?.roundId && !findRound(sheet.roundId) && loaded) closeSheet();
	if (view.name === 'round' && findRound(view.roundId)) renderRound(findRound(view.roundId));
	else if (view.name === 'regulars') renderRegulars();
	else renderList();
	if (storeMode === 'cloud' && view.name === 'regulars') {
		$('foot').innerHTML = `<span>Signed in as ${esc(userEmail)}</span><button data-action="sign-out">Sign out</button>`;
	} else if (storeMode === 'local') {
		$('foot').textContent = 'Saved on this device only. Add your Supabase keys to config.js to sync across devices.';
	} else {
		$('foot').textContent = '';
	}
}

function renderSignIn() {
	$('top').innerHTML = '<div class="brand">Tee Sheet<small>Your rounds, tee times and who’s in</small></div>';
	if (!$('signInForm')) {
		$('main').innerHTML = `<div class="auth"><form class="form" id="signInForm" novalidate>
			<div class="field"><label for="f-email">Email</label><input class="input" type="email" id="f-email" autocomplete="username" inputmode="email" autocapitalize="off"></div>
			<div class="field"><label for="f-password">Password</label><input class="input" type="password" id="f-password" autocomplete="current-password"></div>
			<p class="err" id="formErr" hidden></p>
			<button class="primary" type="submit" id="signInBtn">Sign in</button>
		</form></div>`;
	}
	$('foot').textContent = '';
	$('bar').hidden = true;
}

function meterHtml(r) {
	if (!r.teeTimes.length) return '';
	return '<div class="meter" aria-hidden="true">' + r.teeTimes.map(t => {
		const ps = playersAt(r, t.id);
		let dots = '';
		for (let i = 0; i < Math.max(SLOTS_PER_TEE, ps.length); i++) {
			const p = ps[i];
			dots += `<span class="dot ${i >= SLOTS_PER_TEE ? 'over' : p ? p.status : ''}"></span>`;
		}
		return `<span class="meter-group">${dots}</span>`;
	}).join('') + '</div>';
}

function cardHtml(r, past) {
	const c = counts(r);
	const chips = [
		r.tentative ? '<span class="chip tentative">Tentative</span>' : '',
		c.in ? `<span class="chip in">${c.in} in</span>` : '',
		c.pending ? `<span class="chip pending">${c.pending} pending</span>` : '',
		c.out ? `<span class="chip out">${c.out} out</span>` : '',
		r.example ? '<span class="chip tag">Example</span>' : '',
	].join('');
	return `<button class="card${past ? ' past' : ''}" data-action="open" data-id="${esc(r.id)}">
		<span class="cal">
			<span class="cal-dow">${esc(fmtDate(r.date, {weekday: 'short'}).toUpperCase())}</span>
			<span class="cal-day">${parseDate(r.date).getDate()}</span>
			<span class="cal-mon">${esc(fmtDate(r.date, {month: 'short'}).toUpperCase())}</span>
		</span>
		<span class="card-body">
			<span class="card-top"><span class="card-title">${esc(r.course)}</span><span class="card-when">${esc(relDay(r.date))}</span></span>
			${r.teeTimes.length
				? `<span class="card-times">${esc(fmtTimes(r.teeTimes))}</span>`
				: '<span class="card-times none">No tee times yet</span>'}
			${past ? '' : meterHtml(r)}
			${chips ? `<span class="counts">${chips}</span>` : ''}
		</span>
	</button>`;
}

function renderList() {
	$('top').innerHTML = `<div class="brand">Tee Sheet<small>${esc(fmtDate(todayStr(), {weekday: 'long', month: 'long', day: 'numeric'}))}</small></div><button class="link-btn" data-action="regulars">Golfers</button>`;
	const today = todayStr();
	const upcoming = rounds.filter(r => r.date >= today).sort(byWhen);
	const past = rounds.filter(r => r.date < today).sort((a, b) => byWhen(b, a));
	const waiting = upcoming.reduce((n, r) => n + counts(r).pending, 0);
	let html = '';
	if (rounds.some(r => r.example)) {
		html += `<div class="notice"><span>Example rounds are showing so you can see how it works.</span><button data-action="clear-examples">Remove examples</button></div>`;
	}
	if (!loaded) {
		html += `<div class="empty"><strong>Loading your rounds…</strong><span>Upcoming tee times will show here.</span></div>`;
	} else if (!upcoming.length) {
		html += `<div class="section-label">Upcoming</div><div class="empty"><strong>No rounds on the books</strong><span>Tap “New round” to add a course, date and tee times.</span></div>`;
	} else {
		html += `<div class="section-label"><span>Upcoming · ${upcoming.length}</span>${waiting ? `<span class="chip pending">Waiting on ${waiting}</span>` : ''}</div>`;
		html += `<div class="cards">${upcoming.map(r => cardHtml(r, false)).join('')}</div>`;
	}
	if (past.length) {
		html += `<div class="section-label"><span>Played · ${past.length}</span><button data-action="toggle-past" aria-expanded="${showPast}">${showPast ? 'Hide' : 'Show'}</button></div>`;
		if (showPast) html += `<div class="cards">${past.map(r => cardHtml(r, true)).join('')}</div>`;
	}
	$('main').innerHTML = html;
	$('barInner').innerHTML = '<button class="primary" data-action="new-round">New round</button>';
	$('bar').hidden = false;
}

function noteHtml(p) {
	return p.note ? `<span class="p-note">${esc(p.note)}</span>` : '';
}
const gripIcon = '<svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="9" cy="16" r="1.6"/></g></svg>';
function playerRow(r, p) {
	const draggable = p.status !== 'out' && r.teeTimes.length > 0;
	const tee = r.teeTimes.some(t => t.id === p.teeTimeId) ? p.teeTimeId : '';
	return `<li class="player${p.status === 'out' ? ' is-out' : ''}" data-pid="${esc(p.id)}"${draggable ? ` data-tee="${esc(tee)}"` : ''}>
		${draggable ? `<span class="grip" data-grip title="Drag to another tee time">${gripIcon}</span>` : ''}
		<button class="p-main" data-action="edit-player" data-pid="${esc(p.id)}">
			<span class="p-name">${esc(p.name)}${isLeague(p) ? '<span class="league">League</span>' : ''}</span>
			${noteHtml(p)}
		</button>
		<button class="pill ${p.status}" data-action="cycle" data-pid="${esc(p.id)}" aria-label="${esc(p.name)} is ${STATUS_LABEL[p.status]}. Tap to change.">${STATUS_LABEL[p.status]}</button>
	</li>`;
}
function openSlot(tee, label) {
	return `<li><button class="open-slot" data-action="invite-players" data-tee="${esc(tee)}"><span class="plus" aria-hidden="true">+</span>${label}</button></li>`;
}
function renderRound(r) {
	const c = counts(r);
	$('top').innerHTML = `<button class="back" data-action="back">${icoBack}Rounds</button><button class="link-btn" data-action="edit-round">Edit round</button>`;
	let html = `<h1 class="course">${esc(r.course)}</h1>
		<p class="when">${esc(fmtDate(r.date, {weekday: 'long', month: 'long', day: 'numeric'}))} · ${esc(relDay(r.date))}</p>
		${r.tentative ? '<div class="notice tentative-note"><span><b>Tentative.</b> These tee times aren’t booked yet.</span><button data-action="mark-booked">Mark as booked</button></div>' : ''}
		${r.notes ? `<p class="notes">${esc(r.notes)}</p>` : ''}
		<div class="summary">
			<div class="stat in"><b>${c.in}</b><span>In</span></div>
			<div class="stat pending"><b>${c.pending}</b><span>Pending</span></div>
			<div class="stat out"><b>${c.out}</b><span>Out</span></div>
			<div class="stat${c.open < 0 ? ' over' : ''}"><b>${c.spots ? Math.abs(c.open) : '–'}</b><span>${c.open < 0 ? 'Over' : 'Open'}</span></div>
		</div>`;

	r.teeTimes.forEach(t => {
		const ps = playersAt(r, t.id);
		const {clock, mer} = splitTime(t.time);
		const over = ps.length > SLOTS_PER_TEE;
		let open = '';
		for (let i = ps.length; i < SLOTS_PER_TEE; i++) {
			open += openSlot(t.id, 'Open spot');
		}
		html += `<section class="tee" data-drop-tee="${esc(t.id)}" data-full="${ps.length >= SLOTS_PER_TEE}" aria-label="${esc(fmtTime(t.time))} tee time">
			<div class="tee-head">
				<span class="tee-time">${clock}<small>${mer}</small></span>
				<span class="tee-fill${over ? ' over' : ''}">${over ? `${ps.length} booked, max ${SLOTS_PER_TEE}` : `${ps.length} of ${SLOTS_PER_TEE}`}${meterHtml({teeTimes: [t], players: ps})}</span>
			</div>
			<ul class="slots">${ps.map(p => playerRow(r, p)).join('')}${open}</ul>
		</section>`;
	});

	const teeIds = new Set(r.teeTimes.map(t => t.id));
	const unassigned = r.players.filter(p => p.status !== 'out' && !teeIds.has(p.teeTimeId)).sort(byStatusThenLeague);
	if (unassigned.length || !r.teeTimes.length) {
		html += `<section class="tee"${r.teeTimes.length ? ' data-drop-tee=""' : ''}><div class="tee-head"><span class="tee-label">${r.teeTimes.length ? 'No tee time yet' : 'Players'}</span><span class="tee-fill">${unassigned.length}</span></div>
			<ul class="slots">${unassigned.map(p => playerRow(r, p)).join('')}${!unassigned.length ? openSlot('', 'Invite the first player') : ''}</ul></section>`;
		if (!r.teeTimes.length) html += '<p class="hint">Add tee times from “Edit round” to split players into groups of four.</p>';
	} else {
		html += `<section class="tee drop-only" data-drop-tee=""><div class="tee-head"><span class="tee-label">No tee time yet</span></div>
			<p class="drop-hint">Drop here to take them off a tee time</p></section>`;
	}

	const out = r.players.filter(p => p.status === 'out');
	if (out.length) {
		html += `<section class="tee"><div class="tee-head"><span class="tee-label">Can’t make it</span><span class="tee-fill">${out.length}</span></div>
			<ul class="slots">${out.map(p => playerRow(r, p)).join('')}</ul></section>`;
	}

	html += `<div class="row-actions">
		<button class="ghost" data-action="message">Invite text</button>
		<button class="ghost" data-action="add-tee">Add tee time</button>
	</div>`;
	$('main').innerHTML = html;
	$('barInner').innerHTML = '<button class="primary" data-action="invite-players" data-tee="auto">Invite player</button>';
	$('bar').hidden = false;
}

function playedLabel(s) {
	if (!s.played) return 'No rounds yet';
	return `${s.played} round${s.played === 1 ? '' : 's'} · latest ${fmtDate(s.last, {month: 'short', day: 'numeric'})}`;
}
function regularRow(g, stats) {
	return `<li class="player">
		<button class="p-main" data-action="edit-regular" data-gid="${esc(g.id)}">
			<span class="p-name">${esc(g.name)}</span>
			<span class="p-sub">${playedLabel(stats(g))}</span>
		</button>
		<button class="pill league-toggle${g.league ? ' on' : ''}" data-action="toggle-league" data-gid="${esc(g.id)}" aria-pressed="${g.league}" aria-label="${esc(g.name)} ${g.league ? 'is' : 'is not'} in men’s league. Tap to change.">${g.league ? 'In league' : 'Not in league'}</button>
	</li>`;
}

function renderRegulars() {
	$('top').innerHTML = `<button class="back" data-action="back">${icoBack}Rounds</button>`;
	const stats = golferStats();
	const ranked = rankedRegulars();
	const league = ranked.filter(g => g.league);
	const others = ranked.filter(g => !g.league);
	const unsaved = unsavedNames();
	let html = '<div class="page-head"><h1 class="course">Golfers</h1><p class="when">Golfers who’ve said yes to the most rounds show first when you invite players.</p></div>';
	if (unsaved.length) {
		html += `<div class="notice"><span>${unsaved.length} ${unsaved.length === 1 ? 'person' : 'people'} from your rounds ${unsaved.length === 1 ? 'isn’t' : 'aren’t'} saved yet.</span><button data-action="import-regulars">Add ${unsaved.length === 1 ? 'them' : 'all'}</button></div>`;
	}
	if (!regulars.length) {
		html += '<div class="empty"><strong>No golfers yet</strong><span>Add the people you play with, or paste a list from your notes. Mark who’s in men’s league.</span></div>';
	}
	if (league.length) {
		html += `<div class="section-label">Men’s league · ${league.length}</div><section class="list-card"><ul class="slots">${league.map(g => regularRow(g, stats)).join('')}</ul></section>`;
	}
	if (others.length) {
		html += `<div class="section-label">Others · ${others.length}</div><section class="list-card"><ul class="slots">${others.map(g => regularRow(g, stats)).join('')}</ul></section>`;
	}
	$('main').innerHTML = html;
	$('barInner').innerHTML = '<button class="secondary" data-action="import-list">Import list</button><button class="primary" data-action="add-regular">Add golfer</button>';
	$('bar').hidden = false;
}

/* Sheets */
function openSheet(kind, data) {
	sheet = {kind, ...data};
	$('sheet').innerHTML = sheetHtml();
	$('sheetWrap').hidden = false;
	document.body.style.overflow = 'hidden';
	const focusEl = $('sheet').querySelector('[data-autofocus]');
	if (focusEl) focusEl.focus();
	else $('sheet').querySelector('.x')?.focus();
}
function closeSheet() {
	sheet = null;
	$('sheetWrap').hidden = true;
	$('sheet').innerHTML = '';
	document.body.style.overflow = '';
}
function sheetHead(title) {
	return `<div class="sheet-head"><h2 id="sheetTitle">${esc(title)}</h2><button class="x" type="button" data-action="close-sheet" aria-label="Close">×</button></div>`;
}
function statusSeg(current) {
	return `<div class="field"><span class="lbl" id="statusLbl">Status</span><div class="seg" role="radiogroup" aria-labelledby="statusLbl">
		${['in', 'pending', 'out'].map(s => `<input type="radio" name="status" id="st-${s}" value="${s}"${current === s ? ' checked' : ''}><label for="st-${s}">${STATUS_LABEL[s]}</label>`).join('')}
	</div></div>`;
}

function sheetHtml() {
	if (sheet.kind === 'round') return roundSheet();
	if (sheet.kind === 'invite-players') return invitePlayersSheet();
	if (sheet.kind === 'edit-player') return editPlayerSheet();
	if (sheet.kind === 'message') return messageSheet();
	if (sheet.kind === 'regular') return regularSheet();
	if (sheet.kind === 'import') return importSheet();
	return '';
}

function roundSheet() {
	const r = sheet.roundId ? findRound(sheet.roundId) : null;
	const times = sheet.times;
	return sheetHead(r ? 'Edit round' : 'New round') + `<form class="form" id="roundForm" novalidate>
		<datalist id="courseList">${knownCourses().map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
		<div class="field"><label for="f-course">Course</label><input class="input" id="f-course" name="course" list="courseList" autocomplete="off" value="${esc(r?.course ?? '')}" placeholder="e.g. Pine Hollow Golf Club" ${r ? '' : 'data-autofocus'}></div>
		<div class="field"><label for="f-date">Date</label><input class="input" type="date" id="f-date" name="date" value="${esc(r?.date ?? sheet.defaultDate)}"></div>
		<div class="field"><span class="lbl" id="bookingLbl">Tee times are</span><div class="seg two" role="radiogroup" aria-labelledby="bookingLbl">
			<input type="radio" name="booking" id="bk-booked" value="booked"${r?.tentative ? '' : ' checked'}><label for="bk-booked">Booked</label>
			<input type="radio" name="booking" id="bk-tentative" value="tentative"${r?.tentative ? ' checked' : ''}><label for="bk-tentative">Tentative</label>
		</div></div>
		<div class="field"><span class="lbl">Tee times</span><div class="times">
			${times.map((t, i) => `<div class="time-row"><input class="input" type="time" id="f-time-${esc(t.id)}" data-time-id="${esc(t.id)}" value="${esc(t.time)}" step="60" aria-label="Tee time ${i + 1}"><button class="x" type="button" data-action="remove-time" data-tid="${esc(t.id)}" aria-label="Remove tee time ${i + 1}">×</button></div>`).join('')}
			<button class="add-time" type="button" data-action="add-time">+ Add tee time</button>
		</div></div>
		<div class="field"><label for="f-notes">Notes</label><textarea class="input" id="f-notes" name="notes" placeholder="Carts, green fees, who’s driving…">${esc(r?.notes ?? '')}</textarea></div>
		<p class="err" id="formErr" hidden></p>
		<div class="sheet-actions"><button class="primary" type="submit">${r ? 'Save changes' : 'Create round'}</button>
		${r ? `<button class="danger-btn${sheet.armed ? ' armed' : ''}" type="button" data-action="delete-round">${sheet.armed ? 'Tap again to delete this round' : 'Delete round'}</button>` : ''}</div>
	</form>`;
}

function pickRows(r) {
	const stats = golferStats();
	return rankedRegulars().filter(g => !onRound(r, g)).map(g => {
		const on = sheet.selected.has(g.id);
		return `<li><button type="button" class="pick-row${on ? ' on' : ''}" data-action="toggle-pick" data-gid="${esc(g.id)}" data-search="${esc(g.name.toLowerCase())}" aria-pressed="${on}">
			<span class="tick" aria-hidden="true"></span>
			<span class="pick-text"><span class="p-name">${esc(g.name)}${g.league ? '<span class="league">League</span>' : ''}</span><span class="p-sub">${playedLabel(stats(g))}</span></span>
		</button></li>`;
	}).join('');
}
function inviteLabel() {
	const count = sheet.selected.size + ($('f-name')?.value.trim() ? 1 : 0);
	return count ? `Invite ${count}` : 'Invite';
}
function invitePlayersSheet() {
	const r = findRound(sheet.roundId);
	const available = rankedRegulars().filter(g => !onRound(r, g));
	const showNew = !available.length;
	const teeOpts = [
		`<option value="auto"${sheet.tee === 'auto' ? ' selected' : ''}>Next open spot</option>`,
		...r.teeTimes.map(t => `<option value="${esc(t.id)}"${sheet.tee === t.id ? ' selected' : ''}>${esc(fmtTime(t.time))} (${playersAt(r, t.id).length} of ${SLOTS_PER_TEE})</option>`),
		`<option value=""${sheet.tee === '' ? ' selected' : ''}>No tee time yet</option>`,
	].join('');
	let list = '<p class="hint">Save golfers from the Golfers screen and they’ll show here to pick from.</p>';
	if (available.length) list = `<section class="list-card picker"><ul class="slots" id="pickList">${pickRows(r)}</ul></section>`;
	else if (regulars.length) list = '<p class="hint">All your golfers are already on this round.</p>';
	return sheetHead('Invite players') + `<form class="form" id="invitePlayersForm" novalidate>
		${available.length > 8 ? '<input class="input" type="search" id="f-search" placeholder="Search golfers" autocomplete="off" aria-label="Search golfers">' : ''}
		${list}
		<datalist id="nameList">${unsavedNames().filter(n => !r.players.some(p => sameName(p.name, n))).map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
		<button type="button" class="text-btn" id="showNewBtn" data-action="show-new-person"${showNew ? ' hidden' : ''}>Someone not in your golfers?</button>
		<div class="form" id="newPerson"${showNew ? '' : ' hidden'}>
			<div class="field"><label for="f-name">Someone new</label><input class="input" id="f-name" list="nameList" autocomplete="off" autocapitalize="words" placeholder="Name"></div>
			<div class="checks">
				<label class="check"><input type="checkbox" id="f-save" checked>Save to golfers</label>
				<label class="check" id="leagueCheck"><input type="checkbox" id="f-league">In men’s league</label>
			</div>
		</div>
		${r.teeTimes.length ? `<div class="field"><label for="f-tee">Tee time</label><select class="input" id="f-tee">${teeOpts}</select></div>` : ''}
		<p class="err" id="formErr" hidden></p>
		<div class="sheet-actions sticky"><button class="primary" type="submit" id="inviteBtn">${inviteLabel()}</button></div>
	</form>`;
}
function submitInvitePlayers() {
	const r = findRound(sheet.roundId);
	const name = $('f-name').value.trim();
	const picked = rankedRegulars().filter(g => sheet.selected.has(g.id));
	const invitees = picked.map(g => ({name: g.name, regularId: g.id}));
	if (name) {
		if (r.players.some(p => sameName(p.name, name))) return showErr(`${name} is already on this round.`);
		let g = regulars.find(x => sameName(x.name, name));
		if (!g && $('f-save').checked) {
			g = {id: uid(), name, league: $('f-league').checked};
			saveDoc('regulars', g);
		}
		if (!picked.some(x => x.id === g?.id)) invitees.push({name, regularId: g?.id ?? ''});
	}
	if (!invitees.length) return showErr('Pick at least one golfer, or type a name.');
	const tee = $('f-tee')?.value ?? '';
	editRound(r.id, x => invitees.forEach(i => {
		x.players.push({id: uid(), name: i.name, regularId: i.regularId, status: 'pending', teeTimeId: tee === 'auto' ? firstOpenTee(x) : tee});
	}));
	closeSheet();
	toast(invitees.length === 1 ? `Invited ${invitees[0].name}` : `Invited ${invitees.length} players`);
}

function parseNameList(text) {
	const seen = new Set();
	return text.split(/[\n,;]+/)
		.map(line => line.replace(/^\s*(?:(?:[-*•◦▪‣·–—]|\d+[.)]|\[[ xX]?\]|[☐☑✓✔✅])\s*)+/u, '').replace(/\s+/g, ' ').trim())
		.filter(name => {
			const key = name.toLowerCase();
			if (!/\p{L}/u.test(name) || seen.has(key)) return false;
			seen.add(key);
			return true;
		});
}
function importNames() {
	const names = parseNameList($('f-import')?.value ?? '');
	const fresh = names.filter(n => !regulars.some(g => sameName(g.name, n)));
	return {fresh, skipped: names.length - fresh.length};
}
function importPreviewHtml() {
	const {fresh, skipped} = importNames();
	if (!fresh.length && !skipped) return '';
	const allLeague = fresh.length && fresh.every(n => sheet.league.has(n.toLowerCase()));
	const rows = fresh.map(n => {
		const on = sheet.league.has(n.toLowerCase());
		return `<li class="player"><span class="p-main"><span class="p-name">${esc(n)}</span></span>
			<button type="button" class="pill league-toggle${on ? ' on' : ''}" data-action="import-league" data-key="${esc(n.toLowerCase())}" aria-pressed="${on}" aria-label="${esc(n)} ${on ? 'is' : 'is not'} in men’s league. Tap to change.">${on ? 'In league' : 'Not in league'}</button></li>`;
	}).join('');
	return `<div class="section-label"><span>${fresh.length} new</span>${fresh.length ? `<button type="button" data-action="import-all-league">${allLeague ? 'Unmark all' : 'Mark all league'}</button>` : ''}</div>
		${fresh.length ? `<section class="list-card"><ul class="slots">${rows}</ul></section>` : ''}
		${skipped ? `<p class="hint">${skipped} already saved, so ${skipped === 1 ? 'it’ll' : 'they’ll'} be skipped.</p>` : ''}`;
}
function updateImport() {
	const {fresh} = importNames();
	$('importPreview').innerHTML = importPreviewHtml();
	$('importBtn').textContent = fresh.length ? `Import ${fresh.length} golfer${fresh.length === 1 ? '' : 's'}` : 'Import';
	$('importBtn').disabled = !fresh.length;
}
function importSheet() {
	return sheetHead('Import golfers') + `<form class="form" id="importForm" novalidate>
		<p class="hint">Copy a list of names from Notes and paste it here, one name per line. Bullets, numbers and checkboxes are removed.</p>
		<textarea class="input" id="f-import" placeholder="Dave Smith&#10;Chris&#10;Sam" aria-label="Names to import" data-autofocus></textarea>
		<div id="importPreview"></div>
		<div class="sheet-actions sticky"><button class="primary" type="submit" id="importBtn" disabled>Import</button></div>
	</form>`;
}
function submitImport() {
	const {fresh} = importNames();
	if (!fresh.length) return;
	fresh.forEach(name => saveDoc('regulars', {id: uid(), name, league: sheet.league.has(name.toLowerCase())}));
	closeSheet();
	toast(`Imported ${fresh.length} golfer${fresh.length === 1 ? '' : 's'}`);
}

function regularSheet() {
	const g = sheet.gid ? regulars.find(x => x.id === sheet.gid) : null;
	const actions = g
		? `<div class="sheet-actions"><button class="primary" type="submit">Save</button>
			<button class="danger-btn" type="button" data-action="delete-regular">Remove from golfers</button></div>`
		: '<div class="sheet-actions two"><button class="primary" type="submit">Add</button><button class="secondary" type="submit" name="again" value="1">Add another</button></div>';
	return sheetHead(g ? g.name : 'Add golfer') + `<form class="form" id="regularForm" novalidate>
		<div class="field"><label for="f-name">Name</label><input class="input" id="f-name" name="name" autocomplete="off" autocapitalize="words" value="${esc(g?.name ?? '')}"${g ? '' : ' data-autofocus'}></div>
		<label class="check"><input type="checkbox" id="f-league"${g?.league || sheet.league ? ' checked' : ''}>In men’s league</label>
		<p class="err" id="formErr" hidden></p>
		${actions}
	</form>`;
}
function submitRegular(again) {
	const name = $('f-name').value.trim();
	if (!name) return showErr('Add a name.');
	if (regulars.some(x => x.id !== sheet.gid && sameName(x.name, name))) return showErr(`${name} is already in your golfers.`);
	const league = $('f-league').checked;
	const g = sheet.gid ? regulars.find(x => x.id === sheet.gid) : null;
	saveDoc('regulars', g ? {...g, name, league} : {id: uid(), name, league});
	if (again) {
		sheet.league = league;
		rerenderSheet();
		$('f-name').focus();
		toast(`Added ${name}`);
	} else {
		closeSheet();
	}
}

function editPlayerSheet() {
	const r = findRound(sheet.roundId);
	const p = r.players.find(x => x.id === sheet.pid);
	if (!p) return '';
	return sheetHead(p.name) + `<form class="form" id="editPlayerForm" novalidate>
		<div class="field"><label for="f-name">Name</label><input class="input" id="f-name" name="name" autocomplete="off" autocapitalize="words" value="${esc(p.name)}"></div>
		${statusSeg(p.status)}
		<div class="field"><label for="f-note">Note</label><textarea class="input note-box" id="f-note" rows="2" placeholder="e.g. Needs the later tee time, or still confirming">${esc(p.note || '')}</textarea></div>
		<p class="err" id="formErr" hidden></p>
		<div class="sheet-actions"><button class="primary" type="submit">Save</button>
			<button class="danger-btn${sheet.armed ? ' armed' : ''}" type="button" data-action="remove-player">${sheet.armed ? `Tap again to remove ${esc(p.name)}` : 'Remove from round'}</button>
		</div>
	</form>`;
}

function messageSheet() {
	return sheetHead('Invite text') + `<div class="form">
		<p class="hint">Edit it for whoever you’re sending to, then copy.</p>
		<textarea class="input message-box" id="f-message" aria-label="Invite text">${esc(sheet.text)}</textarea>
		<p class="hint" id="copyHint" hidden>Copying didn’t work in this browser. The text is selected, so copy it yourself.</p>
		<div class="sheet-actions"><button class="primary" type="button" data-action="copy-message">Copy text</button></div>
	</div>`;
}

function rerenderSheet() {
	if (!sheet) return;
	const scroll = $('sheet').scrollTop;
	$('sheet').innerHTML = sheetHtml();
	$('sheet').scrollTop = scroll;
}
function showErr(msg) {
	const el = $('formErr');
	el.textContent = msg;
	el.hidden = false;
}

function readRoundTimes() {
	$('sheet').querySelectorAll('[data-time-id]').forEach(inp => {
		const t = sheet.times.find(x => x.id === inp.dataset.timeId);
		if (t) t.time = inp.value;
	});
}
function keepRoundDraft() {
	sheet.draft = {
		course: $('f-course').value,
		date: $('f-date').value,
		notes: $('f-notes').value,
		tentative: $('bk-tentative').checked,
	};
}
function restoreRoundDraft() {
	if (!sheet.draft) return;
	$('f-course').value = sheet.draft.course;
	$('f-date').value = sheet.draft.date;
	$('f-notes').value = sheet.draft.notes;
	$(sheet.draft.tentative ? 'bk-tentative' : 'bk-booked').checked = true;
}

function submitRound() {
	readRoundTimes();
	const course = $('f-course').value.trim();
	const date = $('f-date').value;
	if (!course) return showErr('Add the course name.');
	if (!date) return showErr('Pick a date.');
	const teeTimes = sheet.times.filter(t => t.time).map(t => ({id: t.id, time: t.time}));
	const notes = $('f-notes').value.trim();
	const tentative = $('bk-tentative').checked;
	if (sheet.roundId) {
		const keep = new Set(teeTimes.map(t => t.id));
		editRound(sheet.roundId, r => {
			r.course = course;
			r.date = date;
			r.notes = notes;
			r.tentative = tentative;
			r.teeTimes = teeTimes;
			r.players.forEach(p => { if (p.teeTimeId && !keep.has(p.teeTimeId)) p.teeTimeId = ''; });
		});
		closeSheet();
		toast('Round updated');
		return;
	}
	const sorted = [...teeTimes].sort((a, b) => a.time.localeCompare(b.time));
	const players = [{id: uid(), name: OWNER_NAME, status: 'in', teeTimeId: sorted[0]?.id ?? ''}];
	const round = {id: uid(), course, date, notes, tentative, teeTimes, players, example: false};
	saveDoc('rounds', round);
	closeSheet();
	view = {name: 'round', roundId: round.id};
	render();
	window.scrollTo(0, 0);
}


function submitEditPlayer() {
	const name = $('f-name').value.trim();
	if (!name) return showErr('Add a name.');
	const r = findRound(sheet.roundId);
	if (r.players.some(p => p.id !== sheet.pid && p.name.toLowerCase() === name.toLowerCase())) return showErr(`${name} is already on this round.`);
	const status = $('sheet').querySelector('input[name="status"]:checked')?.value;
	const note = $('f-note').value.trim();
	editRound(r.id, x => {
		const p = x.players.find(y => y.id === sheet.pid);
		Object.assign(p, {name, status, note});
	});
	closeSheet();
}

function inviteText(r) {
	const day = fmtDate(r.date, {weekday: 'short', month: 'short', day: 'numeric'});
	const tee = r.teeTimes.find(t => t.id === firstOpenTee(r)) || r.teeTimes[0];
	if (r.tentative) return `Thinking about playing ${r.course} on ${day}${tee ? ` around ${fmtTime(tee.time)}` : ''}, you interested?`;
	return `Playing ${r.course} on ${day}${tee ? ` at ${fmtTime(tee.time)}` : ''}, you in?`;
}

let toastTimer = null;
function toast(msg) {
	const el = $('toast');
	el.textContent = msg;
	el.hidden = false;
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

/* Events */
document.addEventListener('click', ev => {
	const btn = ev.target.closest('[data-action]');
	if (!btn) return;
	const action = btn.dataset.action;
	const r = view.name === 'round' ? findRound(view.roundId) : null;

	if (action === 'open') {
		view = {name: 'round', roundId: btn.dataset.id};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'back') {
		view = {name: 'list', roundId: null};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'toggle-past') {
		showPast = !showPast;
		render();
	} else if (action === 'clear-examples') {
		rounds.filter(x => x.example).forEach(x => deleteDoc('rounds', x.id));
		toast('Examples removed');
	} else if (action === 'new-round') {
		const nextSat = new Date();
		nextSat.setDate(nextSat.getDate() + ((6 - nextSat.getDay() + 7) % 7 || 7));
		openSheet('round', {
			roundId: null,
			times: [{id: uid(), time: '08:00'}],
			defaultDate: `${nextSat.getFullYear()}-${pad(nextSat.getMonth() + 1)}-${pad(nextSat.getDate())}`,
		});
	} else if (action === 'edit-round' && r) {
		openSheet('round', {roundId: r.id, times: r.teeTimes.map(t => ({...t}))});
	} else if (action === 'add-tee' && r) {
		const last = r.teeTimes[r.teeTimes.length - 1]?.time;
		openSheet('round', {roundId: r.id, times: [...r.teeTimes.map(t => ({...t})), {id: uid(), time: last ? addMinutes(last, 10) : '08:00'}]});
	} else if (action === 'add-time') {
		readRoundTimes();
		keepRoundDraft();
		const last = sheet.times.filter(t => t.time).map(t => t.time).sort().pop();
		sheet.times.push({id: uid(), time: last ? addMinutes(last, 10) : '08:00'});
		rerenderSheet();
		restoreRoundDraft();
	} else if (action === 'remove-time') {
		readRoundTimes();
		keepRoundDraft();
		sheet.times = sheet.times.filter(t => t.id !== btn.dataset.tid);
		rerenderSheet();
		restoreRoundDraft();
	} else if (action === 'delete-round') {
		if (!sheet.armed) {
			readRoundTimes();
			keepRoundDraft();
			sheet.armed = true;
			rerenderSheet();
			restoreRoundDraft();
			return;
		}
		const id = sheet.roundId;
		closeSheet();
		view = {name: 'list', roundId: null};
		deleteDoc('rounds', id);
		toast('Round deleted');
	} else if (action === 'invite-players' && r) {
		openSheet('invite-players', {roundId: r.id, tee: btn.dataset.tee, selected: new Set()});
	} else if (action === 'mark-booked' && r) {
		editRound(r.id, x => { x.tentative = false; });
		toast('Marked as booked');
	} else if (action === 'show-new-person') {
		$('newPerson').hidden = false;
		btn.hidden = true;
		$('f-name').focus();
	} else if (action === 'toggle-pick') {
		const id = btn.dataset.gid;
		if (sheet.selected.has(id)) sheet.selected.delete(id);
		else sheet.selected.add(id);
		btn.classList.toggle('on', sheet.selected.has(id));
		btn.setAttribute('aria-pressed', sheet.selected.has(id));
		$('inviteBtn').textContent = inviteLabel();
	} else if (action === 'import-list') {
		openSheet('import', {league: new Set()});
	} else if (action === 'import-league') {
		const key = btn.dataset.key;
		if (sheet.league.has(key)) sheet.league.delete(key);
		else sheet.league.add(key);
		updateImport();
	} else if (action === 'import-all-league') {
		const keys = importNames().fresh.map(n => n.toLowerCase());
		const allOn = keys.every(k => sheet.league.has(k));
		keys.forEach(k => (allOn ? sheet.league.delete(k) : sheet.league.add(k)));
		updateImport();
	} else if (action === 'edit-player' && r) {
		openSheet('edit-player', {roundId: r.id, pid: btn.dataset.pid});
	} else if (action === 'remove-player') {
		if (!sheet.armed) {
			sheet.armed = true;
			const btnEl = $('sheet').querySelector('[data-action="remove-player"]');
			btnEl.classList.add('armed');
			btnEl.textContent = `Tap again to remove ${nameOf(findRound(sheet.roundId), sheet.pid)}`;
			return;
		}
		const pid = sheet.pid;
		const name = nameOf(findRound(sheet.roundId), pid);
		editRound(sheet.roundId, x => {
			x.players = x.players.filter(p => p.id !== pid);
		});
		closeSheet();
		toast(`Removed ${name}`);
	} else if (action === 'cycle' && r) {
		const pid = btn.dataset.pid;
		let next = '';
		editRound(r.id, x => {
			const p = x.players.find(y => y.id === pid);
			p.status = NEXT_STATUS[p.status];
			next = p.status;
			if (p.status !== 'out' && !x.teeTimes.some(t => t.id === p.teeTimeId)) {
				p.teeTimeId = x.teeTimes.find(t => playersAt(x, t.id).length < SLOTS_PER_TEE)?.id ?? '';
			}
		});
		const name = nameOf(findRound(r.id), pid);
		toast(`${name}: ${STATUS_LABEL[next]}`);
	} else if (action === 'message' && r) {
		openSheet('message', {roundId: r.id, text: inviteText(r)});
	} else if (action === 'copy-message') {
		const box = $('f-message');
		const fallback = () => {
			$('copyHint').hidden = false;
			box.focus();
			box.select();
		};
		if (navigator.clipboard?.writeText) {
			navigator.clipboard.writeText(box.value).then(() => toast('Copied'), fallback);
		} else {
			fallback();
		}
	} else if (action === 'regulars') {
		view = {name: 'regulars', roundId: null};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'add-regular') {
		openSheet('regular', {gid: null, league: false});
	} else if (action === 'edit-regular') {
		openSheet('regular', {gid: btn.dataset.gid});
	} else if (action === 'toggle-league') {
		const g = regulars.find(x => x.id === btn.dataset.gid);
		saveDoc('regulars', {...g, league: !g.league});
		toast(`${g.name}: ${g.league ? 'not in' : 'in'} men’s league`);
	} else if (action === 'import-regulars') {
		const names = unsavedNames();
		names.forEach(name => saveDoc('regulars', {id: uid(), name, league: false}));
		toast(`Added ${names.length} golfer${names.length === 1 ? '' : 's'}`);
	} else if (action === 'delete-regular') {
		const g = regulars.find(x => x.id === sheet.gid);
		if (!sheet.armed) {
			sheet.armed = true;
			btn.classList.add('armed');
			btn.textContent = `Tap again to remove ${g.name}`;
			return;
		}
		closeSheet();
		deleteDoc('regulars', g.id);
		toast(`Removed ${g.name} from golfers`);
	} else if (action === 'sign-out') {
		sb.auth.signOut();
	} else if (action === 'close-sheet') {
		closeSheet();
	}
});

document.addEventListener('submit', ev => {
	ev.preventDefault();
	const form = ev.target;
	if (form.id === 'roundForm') submitRound();
	else if (form.id === 'invitePlayersForm') submitInvitePlayers();
	else if (form.id === 'importForm') submitImport();
	else if (form.id === 'editPlayerForm') submitEditPlayer();
	else if (form.id === 'signInForm') submitSignIn();
	else if (form.id === 'regularForm') submitRegular(ev.submitter?.name === 'again');
});

document.addEventListener('input', ev => {
	const id = ev.target.id;
	if (id === 'f-search') {
		const q = ev.target.value.trim().toLowerCase();
		$('pickList')?.querySelectorAll('[data-search]').forEach(row => { row.closest('li').hidden = !row.dataset.search.includes(q); });
	} else if (id === 'f-name' && $('inviteBtn')) {
		$('inviteBtn').textContent = inviteLabel();
	} else if (id === 'f-import') {
		updateImport();
	}
});

document.addEventListener('change', ev => {
	if (ev.target.id === 'f-save' && $('leagueCheck')) $('leagueCheck').hidden = !ev.target.checked;
});

/* Drag a golfer by its grip onto another golfer (swap tee times) or onto a group with room (move) */
function dropTargetAt(x, y) {
	const el = document.elementFromPoint(x, y);
	const row = el?.closest('.player[data-tee]');
	if (row && row.dataset.pid !== drag.pid && row.dataset.tee !== drag.fromTee) return {type: 'swap', el: row, pid: row.dataset.pid};
	const group = el?.closest('[data-drop-tee]');
	if (group && group.dataset.dropTee !== drag.fromTee && group.dataset.full !== 'true') return {type: 'move', el: group, tee: group.dataset.dropTee};
	return null;
}
function updateDropTarget() {
	const target = dropTargetAt(drag.x, drag.y);
	if (target?.el === drag.target?.el) return;
	drag.target?.el.classList.remove('drop-target');
	target?.el.classList.add('drop-target');
	drag.target = target;
}
function dragScroll() {
	if (!drag) return;
	const edge = 90;
	const step = drag.y < edge ? -12 : drag.y > innerHeight - edge - 70 ? 12 : 0;
	if (step) {
		window.scrollBy(0, step);
		updateDropTarget();
	}
	requestAnimationFrame(dragScroll);
}
function endDrag(commit) {
	if (!drag) return;
	const {pid, target, ghost, row} = drag;
	ghost.remove();
	row.classList.remove('is-dragging');
	target?.el.classList.remove('drop-target');
	document.body.classList.remove('is-dragging');
	drag = null;
	const r = findRound(view.roundId);
	if (!commit || !target || !r) {
		render();
		return;
	}
	const name = nameOf(r, pid);
	if (target.type === 'swap') {
		editRound(r.id, x => {
			const a = x.players.find(p => p.id === pid);
			const b = x.players.find(p => p.id === target.pid);
			[a.teeTimeId, b.teeTimeId] = [b.teeTimeId, a.teeTimeId];
		});
		toast(`Swapped ${name} and ${nameOf(r, target.pid)}`);
	} else {
		const tee = r.teeTimes.find(t => t.id === target.tee);
		editRound(r.id, x => { x.players.find(p => p.id === pid).teeTimeId = target.tee; });
		toast(`Moved ${name} to ${tee ? fmtTime(tee.time) : 'no tee time'}`);
	}
}

document.addEventListener('pointerdown', ev => {
	const grip = ev.target.closest('[data-grip]');
	if (!grip || drag) return;
	ev.preventDefault();
	const row = grip.closest('.player');
	const rect = row.getBoundingClientRect();
	const ghost = row.cloneNode(true);
	ghost.classList.add('drag-ghost');
	ghost.style.width = `${rect.width}px`;
	ghost.style.left = `${rect.left}px`;
	ghost.style.top = `${rect.top}px`;
	document.body.appendChild(ghost);
	grip.setPointerCapture(ev.pointerId);
	row.classList.add('is-dragging');
	document.body.classList.add('is-dragging');
	drag = {pid: row.dataset.pid, fromTee: row.dataset.tee, row, ghost, offsetY: ev.clientY - rect.top, x: ev.clientX, y: ev.clientY, target: null};
	requestAnimationFrame(dragScroll);
});
document.addEventListener('pointermove', ev => {
	if (!drag) return;
	drag.x = ev.clientX;
	drag.y = ev.clientY;
	drag.ghost.style.top = `${ev.clientY - drag.offsetY}px`;
	updateDropTarget();
});
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));

document.addEventListener('keydown', ev => {
	if (ev.key === 'Escape' && sheet) closeSheet();
});

/* Boot */
async function onSession(session) {
	const id = session?.user?.id ?? null;
	if (id === userId && storeMode !== 'loading') return;
	userId = id;
	userEmail = session?.user?.email ?? '';
	if (channel) {
		sb.removeChannel(channel);
		channel = null;
	}
	closeSheet();
	if (!id) {
		storeMode = 'auth';
		rounds = [];
		regulars = [];
		view = {name: 'list', roundId: null};
		render();
		return;
	}
	storeMode = 'cloud';
	loaded = false;
	$('main').innerHTML = '';
	render();
	await fetchAll();
	channel = sb.channel('rounds-' + id)
		.on('postgres_changes', {event: '*', schema: 'public', table: 'rounds', filter: `user_id=eq.${id}`}, payload => applyChange('rounds', payload))
		.on('postgres_changes', {event: '*', schema: 'public', table: 'regulars', filter: `user_id=eq.${id}`}, payload => applyChange('regulars', payload))
		.subscribe();
}

async function submitSignIn() {
	const email = $('f-email').value.trim();
	const password = $('f-password').value;
	if (!email || !password) return showErr('Enter your email and password.');
	$('signInBtn').disabled = true;
	const {error} = await sb.auth.signInWithPassword({email, password});
	if (error) {
		$('signInBtn').disabled = false;
		showErr(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
	}
}

let pageBaseline = null;
async function reloadIfUpdated() {
	if (location.protocol !== 'https:' || sheet || drag) return;
	try {
		const res = await fetch(location.pathname, {cache: 'no-store'});
		if (!res.ok) return;
		const text = await res.text();
		if (pageBaseline === null) pageBaseline = text;
		else if (text !== pageBaseline) location.reload();
	} catch (updateErr) {
		// Offline: keep running the copy we have.
	}
}

function start() {
	if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
	reloadIfUpdated();
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible') reloadIfUpdated();
	});
	const cfg = window.TEE_SHEET_CONFIG || {};
	if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) {
		storeMode = 'local';
		rounds = lsRead('rounds');
		regulars = lsRead('regulars');
		loaded = true;
		render();
		return;
	}
	sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
	render();
	sb.auth.onAuthStateChange((event, session) => {
		setTimeout(() => onSession(session), 0);
	});
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible') fetchAll();
	});
}

start();
</script>
