function inviteText(r) {
	const day = fmtDate(r.date, {weekday: 'short', month: 'short', day: 'numeric'});
	const tee = r.teeTimes.find(t => t.id === firstOpenTee(r)) || r.teeTimes[0];
	if (r.tentative) return `Thinking about playing ${r.holes} holes at ${r.course} on ${day}${tee ? ` around ${fmtTime(tee.time)}` : ''}, you interested?`;
	return `Playing ${r.holes} holes at ${r.course} on ${day}${tee ? ` at ${fmtTime(tee.time)}` : ''}, you in?`;
}

let toastTimer = null;
function toast(msg) {
	const el = $('toast');
	el.textContent = msg;
	el.hidden = false;
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

/* Events */
document.addEventListener('click', ev => {
	const btn = ev.target.closest('[data-action]');
	const action = btn?.dataset.action;
	if (armedTee && action !== 'remove-tee') {
		armedTee = null;
		render();
	}
	if (!btn) return;
	const r = view.name === 'round' ? findRound(view.roundId) : null;

	if (action === 'open') {
		view = {name: 'round', roundId: btn.dataset.id};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'back') {
		view = {name: 'list', roundId: null};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'toggle-past') {
		showPast = !showPast;
		render();
	} else if (action === 'retry') {
		if (storeMode === 'unreachable') location.reload();
		else {
			syncFailed = false;
			fetchAll();
		}
	} else if (action === 'new-round') {
		const nextSat = new Date();
		nextSat.setDate(nextSat.getDate() + ((6 - nextSat.getDay() + 7) % 7 || 7));
		openSheet('round', {
			roundId: null,
			times: [{id: uid(), time: '08:00', spots: MAX_SPOTS}],
			defaultDate: `${nextSat.getFullYear()}-${pad(nextSat.getMonth() + 1)}-${pad(nextSat.getDate())}`,
		});
	} else if (action === 'edit-round' && r) {
		openSheet('round', {roundId: r.id});
	} else if (action === 'edit-tee' && r) {
		openSheet('tee', {roundId: r.id, teeId: btn.dataset.tee});
	} else if (action === 'add-tee' && r) {
		const last = r.teeTimes[r.teeTimes.length - 1]?.time;
		const time = last ? addMinutes(last, 10) : '08:00';
		editRound(r.id, x => { x.teeTimes.push({id: uid(), time, spots: MAX_SPOTS}); });
		toast(`Added the ${fmtTime(time)} tee time`);
	} else if (action === 'remove-tee' && r) {
		const tee = r.teeTimes.find(t => t.id === btn.dataset.tee);
		if (!tee) return;
		if (armedTee !== tee.id) {
			armedTee = tee.id;
			render();
			setTimeout(() => {
				if (armedTee !== tee.id) return;
				armedTee = null;
				render();
			}, 4000);
			return;
		}
		armedTee = null;
		const moved = playersAt(r, tee.id).length;
		editRound(r.id, x => {
			x.teeTimes = x.teeTimes.filter(t => t.id !== tee.id);
			x.players.forEach(p => { if (p.teeTimeId === tee.id) p.teeTimeId = ''; });
		});
		toast(moved ? `Removed ${fmtTime(tee.time)}. ${moved} golfer${moved === 1 ? '' : 's'} moved to No tee time yet.` : `Removed the ${fmtTime(tee.time)} tee time`);
	} else if (action === 'add-time') {
		readRoundTimes();
		keepRoundDraft();
		const last = sheet.times.filter(t => t.time).map(t => t.time).sort().pop();
		sheet.times.push({id: uid(), time: last ? addMinutes(last, 10) : '08:00', spots: MAX_SPOTS});
		rerenderSheet();
		restoreRoundDraft();
	} else if (action === 'remove-time') {
		readRoundTimes();
		keepRoundDraft();
		sheet.times = sheet.times.filter(t => t.id !== btn.dataset.tid);
		rerenderSheet();
		restoreRoundDraft();
	} else if (action === 'delete-round') {
		if (!sheet.armed) {
			readRoundTimes();
			keepRoundDraft();
			sheet.armed = true;
			rerenderSheet();
			restoreRoundDraft();
			return;
		}
		const id = sheet.roundId;
		closeSheet();
		view = {name: 'list', roundId: null};
		deleteDoc('rounds', id);
		toast('Round deleted');
	} else if (action === 'invite-players' && r) {
		openSheet('invite-players', {roundId: r.id, selected: new Set(), newNames: []});
	} else if (action === 'add-golfers' && r) {
		openSheet('invite-players', {roundId: r.id, selected: new Set(), newNames: [], addTo: btn.dataset.tee});
	} else if (action === 'mark-booked' && r) {
		editRound(r.id, x => {
			x.tentative = false;
			x.bookOn = '';
		});
		toast('Marked as booked');
	} else if (action === 'text-golfer') {
		openMessages(sheet.text);
		sheet.sent.add(btn.dataset.pid);
		btn.innerHTML = `${icoCheck}Texted`;
		btn.closest('li').classList.add('is-sent');
	} else if (action === 'share-round' && r) {
		if (!r.shareToken) editRound(r.id, x => { x.shareToken = newShareToken(); });
		openSheet('share', {roundId: r.id});
	} else if (action === 'copy-link') {
		const box = $('f-share-link');
		if (navigator.clipboard?.writeText) navigator.clipboard.writeText(box.value).then(() => toast('Link copied'), () => box.select());
		else box.select();
	} else if (action === 'text-link') {
		const sr = findRound(sheet.roundId);
		openMessages(`Tee time for ${sr.course} on ${fmtDate(sr.date, {weekday: 'short', month: 'short', day: 'numeric'})}: ${shareUrl(sr)}`);
	} else if (action === 'stop-sharing') {
		if (!sheet.armed) {
			sheet.armed = true;
			btn.classList.add('armed');
			btn.textContent = 'Tap again to turn off this link';
			return;
		}
		editRound(sheet.roundId, x => { x.shareToken = ''; });
		closeSheet();
		toast('Link turned off');
	} else if (action === 'reload') {
		location.reload();
	} else if (action === 'add-new-name') {
		addNewName();
	} else if (action === 'remove-new-name') {
		sheet.newNames = sheet.newNames.filter(n => n !== btn.dataset.name);
		updateInvitePanel();
	} else if (action === 'show-new-person') {
		$('newPerson').hidden = false;
		btn.hidden = true;
		$('f-name').focus();
	} else if (action === 'toggle-pick') {
		const id = btn.dataset.gid;
		if (sheet.selected.has(id)) sheet.selected.delete(id);
		else sheet.selected.add(id);
		sheet.dirty = true;
		const row = $('pickList')?.querySelector(`.pick-row[data-gid="${CSS.escape(id)}"]`);
		row?.classList.toggle('on', sheet.selected.has(id));
		row?.setAttribute('aria-pressed', sheet.selected.has(id));
		updateInvitePanel();
		const search = $('f-search');
		if (search?.value && row === btn) {
			search.value = '';
			$('pickList').querySelectorAll('li').forEach(li => { li.hidden = false; });
			search.focus({preventScroll: true});
		}
	} else if (action === 'edit-player' && r) {
		openSheet('edit-player', {roundId: r.id, pid: btn.dataset.pid});
	} else if (action === 'remove-player') {
		if (!sheet.armed) {
			sheet.armed = true;
			const btnEl = $('sheet').querySelector('[data-action="remove-player"]');
			btnEl.classList.add('armed');
			btnEl.textContent = `Tap again to remove ${nameOf(findRound(sheet.roundId), sheet.pid)}`;
			return;
		}
		const pid = sheet.pid;
		const name = nameOf(findRound(sheet.roundId), pid);
		editRound(sheet.roundId, x => {
			x.players = x.players.filter(p => p.id !== pid);
		});
		closeSheet();
		toast(`Removed ${name}`);
	} else if (action === 'cycle' && r) {
		const pid = btn.dataset.pid;
		editRound(r.id, x => {
			const p = x.players.find(y => y.id === pid);
			setStatus(p, NEXT_STATUS[p.status]);
		});
		toast(statusToast(findRound(r.id), pid));
	} else if (action === 'regulars') {
		view = {name: 'regulars', roundId: null};
		render();
		window.scrollTo(0, 0);
	} else if (action === 'toggle-archived') {
		showArchived = !showArchived;
		render();
	} else if (action === 'restore-regular') {
		const g = regulars.find(x => x.id === btn.dataset.gid);
		saveDoc('regulars', {...g, archived: false});
		toast(`Restored ${g.name}`);
	} else if (action === 'add-regular') {
		openSheet('regular', {gid: null, league: false});
	} else if (action === 'edit-regular') {
		openSheet('regular', {gid: btn.dataset.gid});
	} else if (action === 'delete-regular') {
		const g = regulars.find(x => x.id === sheet.gid);
		if (!sheet.armed) {
			sheet.armed = true;
			btn.classList.add('armed');
			btn.textContent = `Tap again to remove ${g.name}`;
			return;
		}
		closeSheet();
		saveDoc('regulars', {...g, archived: true});
		toast(`Removed ${g.name} from golfers`);
	} else if (action === 'sign-out') {
		sb.auth.signOut();
	} else if (action === 'close-sheet') {
		closeSheet();
	}
});

document.addEventListener('submit', ev => {
	ev.preventDefault();
	const form = ev.target;
	if (form.id === 'roundForm') submitRound();
	else if (form.id === 'invitePlayersForm') submitInvitePlayers();
	else if (form.id === 'editPlayerForm') submitEditPlayer();
	else if (form.id === 'signInForm') submitSignIn();
	else if (form.id === 'teeForm') submitTee();
	else if (form.id === 'regularForm') submitRegular(ev.submitter?.name === 'again');
});

document.addEventListener('input', ev => {
	const id = ev.target.id;
	if (id === 'f-golfer-search') {
		const q = ev.target.value.trim().toLowerCase();
		$('main').querySelectorAll('li[data-search]').forEach(li => { li.hidden = !li.dataset.search.includes(q); });
	} else if (id === 'f-search') {
		const q = ev.target.value.trim().toLowerCase();
		$('pickList')?.querySelectorAll('[data-search]').forEach(row => { row.closest('li').hidden = !row.dataset.search.includes(q); });
	} else if (id === 'f-message') {
		sheet.text = ev.target.value;
	}
	if (sheet && id !== 'f-search' && ev.target.closest('#sheet')) sheet.dirty = true;
});

document.addEventListener('change', ev => {
	if (sheet && ev.target.closest('#sheet')) sheet.dirty = true;
	if (ev.target.name === 'booking' && $('bookOnField')) $('bookOnField').hidden = ev.target.value !== 'tentative';
});

/* Drag a golfer (by the grip, or by holding the row) onto a section to set their status (tee times and No tee time yet = In, Waiting = Pending, Can't make it = Out), or onto a golfer in a tee time to swap */
function dropTargetAt(x, y) {
	const el = document.elementFromPoint(x, y);
	const row = el?.closest('.player[data-status="in"]');
	if (row?.dataset.tee && row.dataset.pid !== drag.pid && row.dataset.tee !== drag.fromTee) return {type: 'swap', el: row, pid: row.dataset.pid};
	const zone = el?.closest('[data-drop-status]');
	if (!zone || zone.dataset.full === 'true') return null;
	const status = zone.dataset.dropStatus;
	const tee = zone.dataset.dropTee ?? '';
	if (status === drag.fromStatus && tee === drag.fromTee) return null;
	return {type: 'move', el: zone, status, tee};
}
function updateDropTarget() {
	const target = dropTargetAt(drag.x, drag.y);
	if (target?.el === drag.target?.el) return;
	drag.target?.el.classList.remove('drop-target');
	target?.el.classList.add('drop-target');
	drag.target = target;
}
function dragScroll() {
	if (!drag) return;
	const edge = 90;
	const step = drag.y < edge ? -12 : drag.y > innerHeight - edge - 70 ? 12 : 0;
	if (step) {
		window.scrollBy(0, step);
		updateDropTarget();
	}
	requestAnimationFrame(dragScroll);
}
function endDrag(commit) {
	if (!drag) return;
	const {pid, target, ghost, row, fromStatus} = drag;
	ghost.remove();
	row.classList.remove('is-dragging');
	target?.el.classList.remove('drop-target');
	document.body.classList.remove('is-dragging');
	drag = null;
	suppressClick = true;
	setTimeout(() => { suppressClick = false; }, 0);
	const r = findRound(view.roundId);
	if (!commit || !target || !r) {
		render();
		return;
	}
	if (target.type !== 'swap') {
		moveGolfer(r.id, pid, target.status, target.tee);
		return;
	}
	const name = nameOf(r, pid);
	const other = nameOf(r, target.pid);
	const destTee = r.players.find(p => p.id === target.pid).teeTimeId;
	editRound(r.id, x => {
		const a = x.players.find(p => p.id === pid);
		const b = x.players.find(p => p.id === target.pid);
		b.teeTimeId = fromStatus === 'in' ? a.teeTimeId : '';
		a.status = 'in';
		a.teeTimeId = destTee;
	});
	toast(fromStatus === 'in' ? `Swapped ${name} and ${other}` : `${name}: In · ${fmtTime(r.teeTimes.find(t => t.id === destTee).time)}. ${other} has no tee time yet.`);
}
function moveGolfer(roundId, pid, status, teeId) {
	const r = findRound(roundId);
	const p = r.players.find(x => x.id === pid);
	const wasIn = p.status === 'in';
	const tee = r.teeTimes.find(t => t.id === teeId);
	const name = displayName(p);
	editRound(roundId, x => {
		const y = x.players.find(z => z.id === pid);
		y.status = status;
		y.teeTimeId = status === 'in' ? teeId : '';
	});
	if (status !== 'in') toast(`${name}: ${STATUS_LABEL[status]}`);
	else if (tee) toast(wasIn ? `Moved ${name} to ${fmtTime(tee.time)}` : `${name}: In · ${fmtTime(tee.time)}`);
	else toast(r.teeTimes.length ? `${name}: In · no tee time yet` : `${name}: In`);
}

function startDrag(row, x, y) {
	const rect = row.getBoundingClientRect();
	const ghost = row.cloneNode(true);
	ghost.classList.add('drag-ghost');
	ghost.style.width = `${rect.width}px`;
	ghost.style.left = `${rect.left}px`;
	ghost.style.top = `${rect.top}px`;
	document.body.appendChild(ghost);
	row.classList.add('is-dragging');
	document.body.classList.add('is-dragging');
	drag = {pid: row.dataset.pid, fromTee: row.dataset.tee, fromStatus: row.dataset.status, row, ghost, offsetY: y - rect.top, x, y, target: null, touch: false};
	requestAnimationFrame(dragScroll);
}
function moveDrag(x, y) {
	drag.x = x;
	drag.y = y;
	drag.ghost.style.top = `${y - drag.offsetY}px`;
	updateDropTarget();
}

// The grip drags right away (it has touch-action: none). Anywhere else on a row: hold briefly on touch
// (so a quick swipe still scrolls and a tap still opens the golfer), or just start moving with a mouse.
let hold = null;
let suppressClick = false;
document.addEventListener('pointerdown', ev => {
	if (drag || sheet) return;
	const row = ev.target.closest('.player[data-pid]');
	if (!row) return;
	if (ev.target.closest('[data-grip]')) {
		ev.preventDefault();
		ev.target.closest('[data-grip]').setPointerCapture(ev.pointerId);
		startDrag(row, ev.clientX, ev.clientY);
	} else if (ev.pointerType === 'mouse' && !ev.target.closest('.pill')) {
		hold = {row, x: ev.clientX, y: ev.clientY, mouse: true};
	}
});
document.addEventListener('pointermove', ev => {
	if (hold?.mouse && Math.hypot(ev.clientX - hold.x, ev.clientY - hold.y) > 6) {
		startDrag(hold.row, hold.x, hold.y);
		hold = null;
	}
	if (drag && !drag.touch) moveDrag(ev.clientX, ev.clientY);
});
document.addEventListener('pointerup', () => {
	if (hold?.mouse) hold = null;
	if (drag && !drag.touch) endDrag(true);
});
document.addEventListener('pointercancel', () => {
	if (drag && !drag.touch) endDrag(false);
});
document.addEventListener('touchstart', ev => {
	if (drag || sheet || ev.touches.length !== 1) return;
	const row = ev.target.closest('.player[data-pid]');
	if (!row || ev.target.closest('[data-grip], .pill')) return;
	const t = ev.touches[0];
	hold = {row, x: t.clientX, y: t.clientY};
	hold.timer = setTimeout(() => {
		if (!hold) return;
		navigator.vibrate?.(15);
		startDrag(hold.row, hold.x, hold.y);
		drag.touch = true;
		hold = null;
	}, 300);
}, {passive: true});
document.addEventListener('touchmove', ev => {
	if (hold && !hold.mouse) {
		const t = ev.touches[0];
		if (Math.abs(t.clientX - hold.x) > 10 || Math.abs(t.clientY - hold.y) > 10) {
			clearTimeout(hold.timer);
			hold = null;
		}
		return;
	}
	if (!drag?.touch) return;
	ev.preventDefault();
	moveDrag(ev.touches[0].clientX, ev.touches[0].clientY);
}, {passive: false});
document.addEventListener('touchend', ev => {
	if (hold && !hold.mouse) {
		clearTimeout(hold.timer);
		hold = null;
	}
	if (!drag?.touch) return;
	ev.preventDefault();
	endDrag(true);
}, {passive: false});
document.addEventListener('touchcancel', () => {
	if (hold && !hold.mouse) clearTimeout(hold.timer);
	hold = null;
	if (drag?.touch) endDrag(false);
});
document.addEventListener('click', ev => {
	if (!suppressClick) return;
	suppressClick = false;
	ev.stopPropagation();
	ev.preventDefault();
}, true);

/* Swipe a sheet down to close it: from its header any time, or anywhere once it's scrolled to the top */
let swipe = null;
function setSwipe(dy, animate) {
	$('sheet').style.transition = animate ? 'transform .2s ease-out' : 'none';
	$('sheet').style.transform = dy ? `translateY(${dy}px)` : '';
	$('sheetWrap').querySelector('.scrim').style.opacity = dy ? String(Math.max(0, 1 - dy / 500)) : '';
}
$('sheet').addEventListener('touchstart', ev => {
	if (ev.touches.length !== 1 || ev.target.closest('input, textarea, select')) return;
	if (($('sheet').scrollTop > 0 || sheet?.dirty) && !ev.target.closest('.sheet-head')) return;
	swipe = {y: ev.touches[0].clientY, t: Date.now(), dy: 0};
}, {passive: true});
$('sheet').addEventListener('touchmove', ev => {
	if (!swipe) return;
	const dy = ev.touches[0].clientY - swipe.y;
	if (!swipe.dy && dy <= 0) {
		swipe = null;
		return;
	}
	if (!swipe.dy && dy < 8) return;
	ev.preventDefault();
	swipe.dy = Math.max(0, dy);
	setSwipe(swipe.dy, false);
}, {passive: false});
$('sheet').addEventListener('touchend', () => {
	if (!swipe) return;
	const {dy, t} = swipe;
	swipe = null;
	const flick = dy > 40 && dy / (Date.now() - t) > 0.6;
	if (dy > $('sheet').offsetHeight / 3 || flick) {
		setSwipe($('sheet').offsetHeight, true);
		setTimeout(closeSheet, 200);
	} else {
		setSwipe(0, true);
	}
});
$('sheet').addEventListener('touchcancel', () => {
	swipe = null;
	setSwipe(0, true);
});

document.addEventListener('keydown', ev => {
	if (ev.key === 'Enter' && ev.target.id === 'f-name' && $('inviteBtn')) {
		ev.preventDefault();
		addNewName();
		return;
	}
	if (ev.key === 'Escape' && sheet) closeSheet();
});

/* Shared round: a read-only page for golfers who aren't signed in, opened with ?r=<shareToken>.
   The shared_round() database function returns only what's safe to show (no notes about golfers,
   no league flags, nobody who's out). */
function newShareToken() {
	const bytes = crypto.getRandomValues(new Uint8Array(16));
	return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function shareUrl(r) {
	return `${location.origin}${location.pathname}?r=${r.shareToken}`;
}
function shareSheet() {
	const r = findRound(sheet.roundId);
	return sheetHead('Share round') + `<div class="form">
		<input class="input" id="f-share-link" readonly value="${esc(shareUrl(r))}" aria-label="Round link">
		<div class="sheet-actions two">
			<button class="secondary" type="button" data-action="copy-link">Copy link</button>
			<button class="primary" type="button" data-action="text-link">Text link</button>
		</div>
		<button class="danger-btn" type="button" data-action="stop-sharing">Stop sharing</button>
	</div>`;
}

async function startPublic(token) {
	storeMode = 'public';
	$('bar').hidden = true;
	$('top').innerHTML = '<div class="brand">Tee Sheet</div>';
	$('main').innerHTML = '<div class="empty"><strong>Loading round…</strong></div>';
	const cfg = window.TEE_SHEET_CONFIG || {};
	let result = {data: null, error: true};
	if (window.supabase && cfg.supabaseUrl && cfg.supabaseKey) {
		const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth: {persistSession: false}});
		try {
			result = await client.rpc('shared_round', {token});
		} catch (shareErr) {
			result = {data: null, error: shareErr};
		}
	}
	if (result.error) {
		$('main').innerHTML = '<div class="empty"><strong>Can’t load this round right now</strong><button class="primary" data-action="reload">Try again</button></div>';
		return;
	}
	if (!result.data) {
		$('main').innerHTML = '<div class="empty"><strong>This round link isn’t active</strong></div>';
		return;
	}
	renderPublic(normalize({id: 'shared', ...result.data, shareToken: token}));
}
function renderPublic(r) {
	const people = list => list.map(p => `<li class="pub-row">${esc(displayName(p))}</li>`).join('');
	let html = `<h1 class="course">${esc(r.course)}</h1>
		<p class="when">${esc(fmtDate(r.date, {weekday: 'long', month: 'long', day: 'numeric'}))} · ${r.holes} holes · ${esc(relDay(r.date))}</p>`;
	if (r.tentative) {
		html += `<div class="booking-card"><div class="booking-text"><span class="booking-title">Tentative</span><span>Tee times aren’t booked yet.</span>
			${r.bookOn ? `<span>Booking opens ${esc(fmtDate(r.bookOn, {weekday: 'short', month: 'short', day: 'numeric'}))}</span>` : ''}</div></div>`;
	}
	if (r.notes) html += `<p class="notes">${esc(r.notes)}</p>`;
	r.teeTimes.forEach(t => {
		const ps = playersAt(r, t.id);
		const {clock, mer} = splitTime(t.time);
		const open = Math.max(0, t.spots - ps.length);
		html += `<section class="tee"><div class="tee-head"><span class="tee-time">${clock}<small>${mer}</small></span><span class="tee-fill">${ps.length} of ${t.spots}</span></div>
			<ul class="slots">${people(ps)}${open ? `<li class="pub-row pub-open">${open} open spot${open === 1 ? '' : 's'}</li>` : ''}</ul></section>`;
	});
	const teeIds = new Set(r.teeTimes.map(t => t.id));
	const unplaced = r.players.filter(p => p.status === 'in' && !teeIds.has(p.teeTimeId));
	if (unplaced.length) html += `<section class="tee"><div class="tee-head"><span class="tee-label">${r.teeTimes.length ? 'No tee time yet' : 'Playing'}</span></div><ul class="slots">${people(unplaced)}</ul></section>`;
	const waiting = r.players.filter(p => p.status === 'pending');
	if (waiting.length) html += `<section class="tee"><div class="tee-head"><span class="tee-label">Waiting to hear back</span></div><ul class="slots">${people(waiting)}</ul></section>`;
	$('main').innerHTML = html;
	$('foot').textContent = `Shared by ${OWNER_NAME}`;
}

/* Boot */
async function onSession(session) {
	const id = session?.user?.id ?? null;
	if (id === userId && storeMode !== 'loading') return;
	userId = id;
	if (channel) {
		sb.removeChannel(channel);
		channel = null;
	}
	closeSheet();
	if (!id) {
		storeMode = 'auth';
		rounds = [];
		regulars = [];
		pending = [];
		view = {name: 'list', roundId: null};
		render();
		return;
	}
	storeMode = 'cloud';
	loaded = loadCache();
	render();
	await fetchAll();
	channel = sb.channel('rounds-' + id)
		.on('postgres_changes', {event: '*', schema: 'public', table: 'rounds', filter: `user_id=eq.${id}`}, payload => applyChange('rounds', payload))
		.on('postgres_changes', {event: '*', schema: 'public', table: 'regulars', filter: `user_id=eq.${id}`}, payload => applyChange('regulars', payload))
		.subscribe();
}

async function submitSignIn() {
	const email = $('f-email').value.trim();
	const password = $('f-password').value;
	if (!email || !password) return showErr('Enter your email and password.');
	$('signInBtn').disabled = true;
	const {error} = await sb.auth.signInWithPassword({email, password});
	if (error) {
		$('signInBtn').disabled = false;
		showErr(error.message === 'Invalid login credentials' ? 'That email and password don’t match.' : error.message);
	}
}

let pageBaseline = null;
async function reloadIfUpdated() {
	if (location.protocol !== 'https:' || sheet || drag) return;
	try {
		const res = await fetch(location.pathname, {cache: 'no-store'});
		if (!res.ok) return;
		const text = await res.text();
		if (pageBaseline === null) pageBaseline = text;
		else if (text !== pageBaseline) location.reload();
	} catch (updateErr) {
		// Offline: keep running the copy we have.
	}
}

function start() {
	if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
	reloadIfUpdated();
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState !== 'visible') return;
		reloadIfUpdated();
		fetchAll();
	});
	window.addEventListener('online', fetchAll);
	setInterval(() => {
		if (pending.length) flush();
	}, 30000);
	const shared = new URLSearchParams(location.search).get('r');
	if (shared) {
		startPublic(shared);
		return;
	}
	const cfg = window.TEE_SHEET_CONFIG || {};
	if (!cfg.supabaseUrl || !cfg.supabaseKey) {
		storeMode = 'local';
		rounds = lsRead('rounds');
		regulars = lsRead('regulars');
		loaded = true;
		render();
		return;
	}
	if (!window.supabase) {
		storeMode = 'unreachable';
		render();
		return;
	}
	sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
	render();
	sb.auth.onAuthStateChange((event, session) => {
		setTimeout(() => onSession(session), 0);
	});
}

start();
</script>
