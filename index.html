<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tee Sheet</title>
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tee Sheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; tee times read like a starter's board; every edit happens in a bottom sheet within thumb reach */
:root {
	--bg: #F2F4EF;
	--surface: #FFFFFF;
	--surface-2: #E8ECE4;
	--line: #D3DBCF;
	--line-strong: #9FAE9C;
	--field: #FFFFFF;
	--ink: #16221B;
	--ink-2: #5A685F;
	--accent: #1C3B61;
	--accent-ink: #FFFFFF;
	--accent-soft: #DCE5F0;
	--in: #2B7A43;
	--in-bg: #DFF0E4;
	--pending: #9A6105;
	--pending-bg: #FAEDD0;
	--out: #A23F37;
	--out-bg: #F6E1DE;
	--scrim: rgba(14, 22, 17, .45);
	--shadow: 0 1px 2px rgba(22, 34, 27, .06), 0 4px 14px rgba(22, 34, 27, .06);
	--font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
	--font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
	--radius: 14px;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #0E1511; --surface: #17201B; --surface-2: #1F2A23; --line: #2D3B32; --line-strong: #4C5F52; --field: #101813; --ink: #E5ECE6; --ink-2: #9AA99F;
		--accent: #93B7E3; --accent-ink: #0B1626; --accent-soft: #1C2B3E; --in: #6FC48B; --in-bg: #173020; --pending: #E8B65A; --pending-bg: #33270E;
		--out: #E58D83; --out-bg: #3A1C19; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #0E1511; --surface: #17201B; --surface-2: #1F2A23; --line: #2D3B32; --line-strong: #4C5F52; --field: #101813; --ink: #E5ECE6; --ink-2: #9AA99F;
	--accent: #93B7E3; --accent-ink: #0B1626; --accent-soft: #1C2B3E; --in: #6FC48B; --in-bg: #173020; --pending: #E8B65A; --pending-bg: #33270E;
	--out: #E58D83; --out-bg: #3A1C19; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
	color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
body {
	margin: 0;
	padding-top: env(safe-area-inset-top, 0px);
	background: var(--bg);
	color: var(--ink);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.4;
	-webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 112px; }

.top {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 10;
	background: var(--bg);
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	padding-block: 14px 10px;
	border-bottom: 1px solid var(--line);
	margin-bottom: 16px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--ink-2); }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px 0 2px; border: 0; background: none; font-weight: 600; color: var(--accent); }
.back svg { width: 20px; height: 20px; }
.link-btn { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; color: var(--accent); }

.notice { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; margin-bottom: 16px; }
.notice button { border: 0; background: none; padding: 6px 0; font-weight: 600; color: var(--accent); min-height: 36px; }

.section-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-block: 22px 10px; display: flex; justify-content: space-between; align-items: center; }
.section-label:first-child { margin-top: 0; }
.section-label button { border: 0; background: none; font: inherit; color: var(--accent); letter-spacing: .08em; min-height: 36px; }

.cards { display: grid; gap: 10px; }
.card {
	width: 100%;
	display: grid;
	grid-template-columns: 58px minmax(0, 1fr);
	gap: 14px;
	align-items: start;
	text-align: left;
	padding: 14px;
	border: 1px solid var(--line);
	border-radius: var(--radius);
	background: var(--surface);
	box-shadow: var(--shadow);
}
.card.past { box-shadow: none; background: transparent; }
.card.past .cal { opacity: .7; }
.cal { display: grid; justify-items: center; padding: 6px 0 8px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-display); line-height: 1; }
.cal-dow { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); }
.cal-day { font-size: 30px; font-weight: 700; margin-block: 2px; font-variant-numeric: tabular-nums; }
.cal-mon { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); }
.card-body { min-width: 0; display: grid; gap: 6px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-title { font-weight: 600; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.card-when { flex: none; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.card-times { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.card-holes { margin-left: 8px; font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
.card-times.none { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--ink-2); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.in { background: var(--in-bg); color: var(--in); }
.chip.pending { background: var(--pending-bg); color: var(--pending); }
.chip.out { background: var(--out-bg); color: var(--out); }

.meter { display: flex; flex-wrap: wrap; gap: 8px; }
.meter-group { display: flex; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.in { background: var(--in); border-color: var(--in); }
.dot.pending { border-color: var(--pending); background: var(--pending-bg); }
.dot.over { border-color: var(--out); background: var(--out); }

.empty { text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); display: grid; gap: 6px; }
.empty strong { color: var(--ink); font-size: 17px; }
.empty .primary { justify-self: center; margin-top: 10px; padding: 0 24px; }

/* Round detail */
.round-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.round-title { min-width: 0; }
.edit-btn { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; margin-top: 2px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.edit-btn:hover { color: var(--accent); border-color: var(--accent); }
.head-actions { flex: none; display: flex; gap: 6px; }
.edit-btn.icon-only { width: 36px; padding: 0; justify-content: center; }
.edit-btn.is-on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pub-row { padding: 14px; font-weight: 600; }
.pub-open { font-weight: 400; color: var(--ink-2); }
.course { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .01em; overflow-wrap: break-word; }
@media (max-width: 359px) { .course { font-size: 28px; } }
.when { color: var(--ink-2); margin-top: 4px; }
.notes { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.stat { padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.stat.in b { color: var(--in); }
.stat.pending b { color: var(--pending); }
.stat.out b { color: var(--out); }
.stat.over b { color: var(--out); }

.tee, .list-card { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tee-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface-2); }
.tee-time { display: inline-flex; align-items: baseline; padding: 0; border: 0; background: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.tee-edit-icon { align-self: center; margin-left: 8px; color: var(--ink-2); opacity: .7; }
.tee-time small { font-size: 16px; font-weight: 600; margin-left: 3px; letter-spacing: .05em; color: var(--ink-2); }
.tee-label { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.tee-fill { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tee-fill.over { color: var(--out); font-weight: 600; }
.slots { list-style: none; margin: 0; padding: 0; }
.slots li + li { border-top: 1px solid var(--line); }
.player { display: flex; align-items: center; gap: 8px; padding-inline: 4px 10px; }
.p-main { flex: 1; min-width: 0; display: grid; align-content: center; gap: 1px; text-align: left; padding: 10px; min-height: 52px; border: 0; background: none; }
.p-name { font-weight: 600; overflow-wrap: anywhere; }
.player.is-out .p-name { text-decoration: line-through; text-decoration-color: var(--ink-2); color: var(--ink-2); }
.p-sub { font-size: 13px; color: var(--ink-2); }
.p-note { justify-self: start; margin-top: 4px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--ink); font-size: 14px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.p-note::before { content: '✎ '; color: var(--ink-2); }
.p-note.g-note { background: var(--accent-soft); }
.p-note.g-note::before { content: '⚑ '; color: var(--accent); }
.player.is-out .p-note { text-decoration: none; }
textarea.input.note-box { min-height: 64px; }
.pill { flex: none; min-width: 88px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.in { background: var(--in-bg); color: var(--in); }
.pill.pending { background: var(--pending-bg); color: var(--pending); border-color: var(--pending); border-style: dashed; }
.pill.pending::before { background: transparent; border: 1.5px solid currentColor; width: 7px; height: 7px; }
.pill.out { background: var(--out-bg); color: var(--out); }
.league { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; }
.page-head { margin-bottom: 16px; }
.restore-btn { flex: none; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: none; color: var(--accent); font-weight: 600; }
.picker { margin-top: 0; }
.pick-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; background: none; text-align: left; }
.pick-row.on { background: var(--accent-soft); }
.tick { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; }
.pick-row.on .tick { background: var(--accent); border-color: var(--accent); }
.pick-row.on .tick::after { content: ''; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.pick-text { min-width: 0; display: grid; gap: 1px; }
.new-row { display: flex; gap: 8px; }
.new-row .input { flex: 1; min-width: 0; }
.new-row .secondary { flex: none; box-shadow: none; }
.picked { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.picked::-webkit-scrollbar { display: none; }
.pick-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px 0 12px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; }
.pick-chip span { font-size: 17px; line-height: 1; opacity: .8; }
.open-slot { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 0; background: none; color: var(--ink-2); text-align: left; }
.open-slot .plus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.open-slot:hover .plus { border-color: var(--accent); color: var(--accent); }
.grip { flex: none; align-self: stretch; width: 30px; margin-right: -6px; display: grid; place-items: center; color: var(--ink-2); opacity: .55; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.grip:hover { opacity: 1; }
.player.is-dragging { opacity: .3; }
.player[data-pid] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.drag-ghost { position: fixed; z-index: 70; margin: 0; list-style: none; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .22); transform: scale(1.02); opacity: .9; }
.drag-ghost .grip { opacity: 1; cursor: grabbing; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }
.player.drop-target { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.tee.drop-target { box-shadow: 0 0 0 2px var(--accent); }
.drop-only { display: none; }
body.is-dragging .drop-only { display: block; }
.drop-only .tee-head { min-height: 64px; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

.tee-remove { flex: none; width: 32px; height: 32px; margin-right: -6px; display: grid; place-items: center; border: 0; border-radius: 999px; background: none; color: var(--ink-2); }
.tee-remove:hover { color: var(--out); }
.tee-remove.armed { width: auto; padding: 0 12px; background: var(--out); color: var(--surface); font-weight: 600; font-size: 13px; }
.dashed-btn { width: 100%; min-height: 48px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); background: none; color: var(--accent); font-weight: 600; }
.add-tee-btn { margin-top: 12px; }

/* Bottom action bar */
.bar {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 20;
	padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
	background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar-inner { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; }
.primary { flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; box-shadow: var(--shadow); }
.secondary { min-height: 52px; padding: 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }
.danger-btn { min-height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--out); font-weight: 600; }
.danger-btn.armed { background: var(--out); border-color: var(--out); color: var(--surface); }

/* Sheet */
.sheet-wrap { position: fixed; top: 0; left: 0; right: 0; height: 100%; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet {
	position: relative;
	width: 100%;
	max-width: 560px;
	max-height: 92%;
	overflow-y: auto;
	overflow-x: hidden;
	overscroll-behavior: contain;
	background: var(--surface);
	border-radius: 20px 20px 0 0;
	--sheet-pb: calc(20px + env(safe-area-inset-bottom, 0px));
	padding: 8px 16px var(--sheet-pb);
	animation: rise .22s ease-out;
}
.sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) {
	.sheet-wrap { align-items: center; }
	.sheet { border-radius: 20px; --sheet-pb: 20px; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; line-height: 1; color: var(--ink-2); }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.input, select.input, textarea.input {
	width: 100%;
	min-height: 48px;
	padding: 10px 12px;
	border: 1.5px solid var(--line-strong);
	border-radius: 10px;
	background: var(--field);
	color: var(--ink);
	-webkit-text-fill-color: var(--ink);
	opacity: 1;
	font-size: 16px;
}
.input::placeholder { color: var(--ink-2); -webkit-text-fill-color: var(--ink-2); opacity: .75; }
.input:focus, .input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.picker-wrap { position: relative; min-width: 0; }
.picker-wrap .input { padding-right: 46px; }
.picker-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: grid; color: var(--accent); pointer-events: none; }
.input::-webkit-calendar-picker-indicator { position: absolute; right: 0; top: 0; width: 46px; height: 100%; opacity: 0; cursor: pointer; }
textarea.input { min-height: 80px; resize: vertical; }
.input[type="date"], .input[type="time"] {
	-webkit-appearance: none;
	appearance: none;
	display: block;
	min-width: 0;
	max-width: 100%;
	text-align: left;
}
.input::-webkit-date-and-time-value { text-align: left; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { min-height: 46px; display: grid; place-items: center; border: 1.5px solid var(--line-strong); border-radius: 10px; font-weight: 600; cursor: pointer; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input[value="in"]:checked + label { background: var(--in-bg); border-color: var(--in); color: var(--in); }
.seg input[value="pending"]:checked + label { background: var(--pending-bg); border-color: var(--pending); color: var(--pending); }
.seg input[value="out"]:checked + label { background: var(--out-bg); border-color: var(--out); color: var(--out); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg input[name="holes"]:checked + label { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.seg input[value="booked"]:checked + label { background: var(--in-bg); border-color: var(--in); color: var(--in); }
.seg input[value="tentative"]:checked + label { background: var(--pending-bg); border-color: var(--pending); border-style: dashed; color: var(--pending); }
.card.tentative { background: var(--pending-bg); border: 1.5px dashed var(--pending); box-shadow: none; }
.card.tentative.due { border-style: solid; }
.card.tentative .cal { background: var(--surface); color: var(--pending); }
.card.tentative .cal-dow, .card.tentative .cal-mon { color: var(--pending); }
.card.tentative .chip.pending { background: var(--surface); }
.card-flag { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--pending); }
.opt { font-weight: 500; text-transform: none; letter-spacing: 0; }
.booking-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 12px 12px 14px; border-radius: var(--radius); background: var(--pending-bg); border: 1.5px dashed var(--pending); }
.booking-card.due { border-style: solid; }
.booking-text { display: grid; gap: 2px; min-width: 0; }
.booking-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--pending); }
.booking-text span { font-size: 15px; color: var(--ink); }
.booking-card.due .booking-text b { color: var(--pending); }
.booking-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--in); color: var(--surface); font-weight: 600; font-size: 15px; }
.times { display: grid; gap: 8px; }
.time-row { display: flex; gap: 8px; }
.time-row .picker-wrap { flex: 1; }
.time-row .input { font-variant-numeric: tabular-nums; }
.time-row select.spots-select { flex: none; width: 116px; padding-inline: 10px 6px; }
@media (max-width: 359px) {
	.time-row { flex-wrap: wrap; }
	.time-row .picker-wrap { flex-basis: 100%; }
	.time-row select.spots-select { flex: 1; width: auto; }
}
.remove-time { flex: none; width: 48px; height: 48px; display: grid; place-items: center; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--field); color: var(--out); }
.remove-time:hover { background: var(--out-bg); border-color: var(--out); }
.add-time { min-height: 44px; border: 1.5px dashed var(--line-strong); border-radius: 10px; background: none; color: var(--accent); font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.sheet-actions { display: grid; gap: 10px; margin-top: 4px; }
.sheet-actions.two { grid-template-columns: 1fr 1fr; }
.sheet-actions .primary, .sheet-actions .secondary { box-shadow: none; }
.sheet-actions.two .secondary { order: -1; }
.sheet-actions.sticky { position: sticky; bottom: calc(-1 * var(--sheet-pb)); z-index: 1; margin: 0 -16px calc(-1 * var(--sheet-pb)); padding: 10px 16px var(--sheet-pb); background: var(--surface); border-top: 1px solid var(--line); }
.primary[disabled] { opacity: .5; }
.text-link { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.send-row { padding-block: 6px; }
.send-row.is-sent .text-link { background: var(--in-bg); color: var(--in); }
.message-box { min-height: 96px; line-height: 1.45; }
.err { color: var(--out); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: 15px; box-shadow: var(--shadow); }
.foot { margin-top: 28px; font-size: 13px; color: var(--ink-2); text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
.foot button { border: 0; background: none; padding: 8px 4px; font-weight: 600; font-size: 13px; color: var(--accent); }

.auth { display: grid; gap: 20px; padding-top: 12vh; }
.auth .form { padding: 18px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
</style>
</head>
<body>

<div class="app">
	<header class="top" id="top"></header>
	<div class="notice" id="status" role="status" hidden></div>
	<main id="main"></main>
	<p class="foot" id="foot"></p>
</div>
<div class="bar" id="bar"><div class="bar-inner" id="barInner"></div></div>
<div class="sheet-wrap" id="sheetWrap" hidden>
	<div class="scrim" data-action="close-sheet"></div>
	<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const MAX_SPOTS = 4;
const OWNER_NAME = window.TEE_SHEET_CONFIG?.ownerName || 'Me';
const STATUS_LABEL = {in: 'In', pending: 'Pending', out: 'Out'};
const NEXT_STATUS = {pending: 'in', in: 'out', out: 'pending'};
const STATUS_ORDER = {in: 0, pending: 1, out: 2};

let rounds = [];
let regulars = [];
let loaded = false;
let storeMode = 'loading';
let sb = null;
let userId = null;
let channel = null;
let view = {name: 'list', roundId: null};
let showPast = false;
let showArchived = false;
let sheet = null;
let drag = null;
let armedTee = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');

function todayStr() {
	const d = new Date();
	return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function parseDate(s) {
	const [y, m, d] = s.split('-').map(Number);
	return new Date(y, m - 1, d);
}
function daysUntil(s) {
	return Math.round((parseDate(s) - parseDate(todayStr())) / 86400000);
}
function relDay(s) {
	const n = daysUntil(s);
	if (n === 0) return 'Today';
	if (n === 1) return 'Tomorrow';
	if (n === -1) return 'Yesterday';
	if (n > 1 && n < 14) return `in ${n} days`;
	if (n >= 14) return `in ${Math.round(n / 7)} weeks`;
	if (n > -14) return `${-n} days ago`;
	return `${Math.round(-n / 7)} weeks ago`;
}
function fmtDate(s, opts) {
	return new Intl.DateTimeFormat(undefined, opts).format(parseDate(s));
}
function splitTime(t) {
	const [h, m] = t.split(':').map(Number);
	return {clock: `${h % 12 || 12}:${pad(m)}`, mer: h < 12 ? 'AM' : 'PM'};
}
function fmtTime(t) {
	const {clock, mer} = splitTime(t);
	return `${clock} ${mer}`;
}
function fmtTimes(teeTimes) {
	const parts = teeTimes.map(t => splitTime(t.time));
	const sameMer = parts.every(p => p.mer === parts[0].mer);
	if (sameMer) return parts.map(p => p.clock).join(' · ') + ' ' + parts[0].mer;
	return parts.map(p => `${p.clock} ${p.mer}`).join(' · ');
}
function addMinutes(t, mins) {
	const [h, m] = t.split(':').map(Number);
	const total = Math.min(h * 60 + m + mins, 23 * 60 + 59);
	return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
}
function firstTime(r) {
	return r.teeTimes?.[0]?.time ?? '99:99';
}
function byWhen(a, b) {
	return a.date.localeCompare(b.date) || firstTime(a).localeCompare(firstTime(b));
}

function normalize(r) {
	return {
		id: r.id,
		course: r.course || 'Untitled course',
		date: r.date || todayStr(),
		holes: r.holes === 9 ? 9 : 18,
		notes: r.notes || '',
		tentative: !!r.tentative,
		bookOn: r.tentative ? r.bookOn || '' : '',
		shareToken: r.shareToken || '',
		teeTimes: (Array.isArray(r.teeTimes) ? r.teeTimes : [])
			.map(t => ({id: t.id, time: t.time, spots: Math.min(MAX_SPOTS, Math.max(1, Number(t.spots) || MAX_SPOTS))}))
			.sort((a, b) => a.time.localeCompare(b.time)),
		players: (Array.isArray(r.players) ? r.players : []).map(p => (p.name === 'Me' ? {...p, name: OWNER_NAME} : p)),
		createdAt: r.createdAt || '',
		updatedAt: r.updatedAt || '',
	};
}
function findRound(id) {
	return rounds.find(r => r.id === id);
}
function counts(r) {
	const c = {in: 0, pending: 0, out: 0};
	r.players.forEach(p => c[p.status]++);
	const spots = r.teeTimes.reduce((n, t) => n + t.spots, 0);
	return {...c, spots, open: spots - c.in};
}
function playersAt(r, teeId) {
	return r.players
		.filter(p => p.teeTimeId === teeId && p.status === 'in')
		.sort(byStatusThenLeague);
}
function firstOpenTee(r) {
	const tee = r.teeTimes.find(t => playersAt(r, t.id).length < t.spots);
	return tee ? tee.id : '';
}
function setStatus(p, status) {
	p.status = status;
	p.teeTimeId = '';
}
function statusToast(r, pid) {
	const p = r.players.find(x => x.id === pid);
	if (p.status === 'in' && r.teeTimes.length) return `${displayName(p)}: In · drag to a tee time`;
	return `${displayName(p)}: ${STATUS_LABEL[p.status]}`;
}
function nameOf(r, pid) {
	const p = r.players.find(x => x.id === pid);
	return p ? displayName(p) : '';
}
function knownCourses() {
	return [...new Set(rounds.map(r => r.course))].sort();
}

function normalizeRegular(g) {
	return {
		id: g.id,
		name: g.name || 'Unnamed',
		league: !!g.league,
		note: g.note || '',
		archived: !!g.archived,
		createdAt: g.createdAt || '',
		updatedAt: g.updatedAt || '',
	};
}
function sameName(a, b) {
	return a.trim().toLowerCase() === b.trim().toLowerCase();
}
function regularFor(p) {
	return p.regularId ? regulars.find(g => g.id === p.regularId) : regulars.find(g => sameName(g.name, p.name));
}
function displayName(p) {
	return (p.regularId && regularFor(p)?.name) || p.name;
}
function isLeague(p) {
	return !!regularFor(p)?.league;
}
function byStatusThenLeague(a, b) {
	return STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || isLeague(b) - isLeague(a);
}
function golferStats() {
	const stats = new Map();
	const today = todayStr();
	rounds.filter(r => r.date < today).forEach(r => regulars.forEach(g => {
		const p = r.players.find(x => regularFor(x)?.id === g.id);
		if (p?.status !== 'in') return;
		const s = stats.get(g.id) || {played: 0, last: ''};
		s.played++;
		if (r.date > s.last) s.last = r.date;
		stats.set(g.id, s);
	}));
	return g => stats.get(g.id) || {played: 0, last: ''};
}
function activeRegulars() {
	return regulars.filter(g => !g.archived);
}
function rankedRegulars(stats) {
	return activeRegulars().sort((a, b) => stats(b).played - stats(a).played || stats(b).last.localeCompare(stats(a).last) || a.name.localeCompare(b.name));
}

/* Storage: Supabase when configured, this browser only when config.js is blank (for testing).
   In cloud mode every change is saved locally first, then sent to Supabase in order. Unsent changes
   survive app restarts and retry when the app comes back online or to the foreground. Each update only
   applies if the row still has the updated_at we last saw, so an edit made on another device is never
   silently overwritten. */
const TABLES = {
	rounds: {lsKey: 'teesheet.rounds.v1', normalize, get: () => rounds, set: list => { rounds = list; }},
	regulars: {lsKey: 'teesheet.regulars.v1', normalize: normalizeRegular, get: () => regulars, set: list => { regulars = list; }},
};
const CACHE_KEY = 'teesheet.cache.v1';
const PENDING_KEY = 'teesheet.pending.v1';
let pending = [];
let serverAt = {};
let flushing = false;
let syncFailed = false;
let loadError = false;

function lsGet(key) {
	try {
		return JSON.parse(localStorage.getItem(key));
	} catch (readErr) {
		return null;
	}
}
function lsSet(key, value) {
	try {
		localStorage.setItem(key, JSON.stringify(value));
	} catch (writeErr) {
		toast('Couldn’t save on this device.');
	}
}
function lsRead(table) {
	return (lsGet(TABLES[table].lsKey) || []).map(TABLES[table].normalize);
}
function saveCache() {
	lsSet(CACHE_KEY, {userId, rounds, regulars, serverAt});
	lsSet(PENDING_KEY, {userId, jobs: pending});
}
function loadCache() {
	const cache = lsGet(CACHE_KEY);
	const saved = lsGet(PENDING_KEY);
	pending = saved?.userId === userId ? saved.jobs : [];
	if (cache?.userId !== userId) return false;
	rounds = cache.rounds.map(normalize);
	regulars = cache.regulars.map(normalizeRegular);
	serverAt = cache.serverAt || {};
	return true;
}

function putLocal(table, doc) {
	TABLES[table].set([...TABLES[table].get().filter(d => d.id !== doc.id), doc]);
}
function saveDoc(table, doc) {
	const now = new Date().toISOString();
	const next = TABLES[table].normalize({...doc, updatedAt: now, createdAt: doc.createdAt || now});
	putLocal(table, next);
	render();
	if (storeMode !== 'cloud') {
		lsSet(TABLES[table].lsKey, TABLES[table].get());
		return;
	}
	const key = `${table}/${next.id}`;
	const job = pending.find(j => j.key === key);
	if (job) Object.assign(job, {op: 'save', doc: next});
	else pending.push({key, table, id: next.id, op: 'save', doc: next, base: serverAt[key] ?? null});
	saveCache();
	flush();
}
function deleteDoc(table, id) {
	TABLES[table].set(TABLES[table].get().filter(d => d.id !== id));
	render();
	if (storeMode !== 'cloud') {
		lsSet(TABLES[table].lsKey, TABLES[table].get());
		return;
	}
	const key = `${table}/${id}`;
	const job = pending.find(j => j.key === key);
	if (job && job.base === null && !flushing) pending = pending.filter(j => j !== job);
	else if (job) Object.assign(job, {op: 'delete', doc: null});
	else pending.push({key, table, id, op: 'delete', doc: null, base: serverAt[key] ?? null});
	saveCache();
	flush();
}

async function sendJob(job) {
	if (job.op === 'delete') {
		const {error} = await sb.from(job.table).delete().eq('id', job.id);
		if (error) throw error;
		return {at: null};
	}
	const {id, ...data} = job.doc;
	const row = {data, updated_at: new Date().toISOString()};
	if (job.base === null) {
		const {data: rows, error} = await sb.from(job.table).insert({id, user_id: userId, ...row}).select('updated_at');
		if (error?.code === '23505') return {conflict: true};
		if (error) throw error;
		return {at: rows[0].updated_at};
	}
	const {data: rows, error} = await sb.from(job.table).update(row).eq('id', id).eq('updated_at', job.base).select('updated_at');
	if (error) throw error;
	return rows.length ? {at: rows[0].updated_at} : {conflict: true};
}
async function takeServerCopy(job) {
	const {data: rows, error} = await sb.from(job.table).select('id, data, updated_at').eq('id', job.id);
	if (error) throw error;
	TABLES[job.table].set(TABLES[job.table].get().filter(d => d.id !== job.id));
	if (rows.length) {
		putLocal(job.table, TABLES[job.table].normalize({id: job.id, ...rows[0].data}));
		serverAt[job.key] = rows[0].updated_at;
	} else {
		delete serverAt[job.key];
	}
	toast('That was changed on another device. Showing the latest.');
}
async function flush() {
	if (storeMode !== 'cloud' || flushing || !pending.length) return;
	flushing = true;
	try {
		while (pending.length) {
			const job = pending[0];
			const sent = {op: job.op, doc: job.doc};
			const result = await sendJob(job);
			if (result.conflict) {
				await takeServerCopy(job);
				pending.shift();
			} else {
				if (result.at) serverAt[job.key] = result.at;
				else delete serverAt[job.key];
				if (job.op === sent.op && job.doc === sent.doc) pending.shift();
				else job.base = serverAt[job.key] ?? null;
			}
			saveCache();
		}
		syncFailed = false;
	} catch (syncErr) {
		syncFailed = true;
	}
	flushing = false;
	render();
}

async function fetchAll() {
	if (storeMode !== 'cloud' || !userId) return;
	try {
		const results = await Promise.all(Object.keys(TABLES).map(async table => {
			const {data, error} = await sb.from(table).select('id, data, updated_at');
			if (error) throw error;
			return [table, data];
		}));
		results.forEach(([table, rows]) => {
			const merged = new Map(rows.map(row => [row.id, TABLES[table].normalize({id: row.id, ...row.data})]));
			rows.forEach(row => { serverAt[`${table}/${row.id}`] = row.updated_at; });
			pending.filter(j => j.table === table).forEach(j => {
				if (j.op === 'save') merged.set(j.id, j.doc);
				else merged.delete(j.id);
			});
			TABLES[table].set([...merged.values()]);
		});
		loaded = true;
		loadError = false;
		saveCache();
		flush();
	} catch (loadErr) {
		loadError = true;
	}
	render();
}
function applyChange(table, payload) {
	const id = payload.new?.id ?? payload.old?.id;
	const key = `${table}/${id}`;
	if (!id || pending.some(j => j.key === key)) return;
	if (payload.eventType === 'DELETE') {
		if (!TABLES[table].get().some(d => d.id === id)) return;
		TABLES[table].set(TABLES[table].get().filter(d => d.id !== id));
		delete serverAt[key];
	} else {
		if (!payload.new.data) return;
		putLocal(table, TABLES[table].normalize({id, ...payload.new.data}));
		serverAt[key] = payload.new.updated_at;
	}
	saveCache();
	render();
}
function editRound(id, mutate) {
	const r = findRound(id);
	if (!r) return;
	const copy = structuredClone(r);
	mutate(copy);
	saveDoc('rounds', copy);
}

/* Rendering */
const icoCalendar = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
const icoClock = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const icoRemove = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const icoCheck = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const icoPencil = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const icoMessage = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5c0 4.1-3.6 7.5-8 7.5-1.2 0-2.3-.2-3.3-.6L4 19.5l1.2-3.6C4.4 14.6 4 13.1 4 11.5 4 7.4 7.6 4 12 4s8 3.4 8 7.5z"/></svg>';
const icoShare = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const icoBack = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

function render() {
	if (drag || storeMode === 'public') return;
	if (storeMode === 'auth') {
		renderSignIn();
		return;
	}
	if (storeMode === 'unreachable' || (storeMode === 'cloud' && !loaded && loadError)) {
		renderUnreachable();
		return;
	}
	if (view.name === 'round' && !findRound(view.roundId) && loaded) view = {name: 'list', roundId: null};
	if (sheet?.roundId && !findRound(sheet.roundId) && loaded) closeSheet();
	if (view.name === 'round' && findRound(view.roundId)) renderRound(findRound(view.roundId));
	else if (view.name === 'regulars') renderRegulars();
	else renderList();
	renderStatus();
	if (storeMode === 'cloud' && view.name === 'list') {
		$('foot').innerHTML = '<button data-action="sign-out">Sign out</button>';
	} else if (storeMode === 'local') {
		$('foot').textContent = 'Device-only test mode: config.js has no Supabase keys.';
	} else {
		$('foot').textContent = '';
	}
}
function renderStatus() {
	let msg = '';
	if (storeMode === 'cloud' && loadError && loaded) msg = 'Offline. Showing your saved copy.';
	else if (storeMode === 'cloud' && pending.length && syncFailed) msg = `${pending.length} change${pending.length === 1 ? '' : 's'} not synced yet.`;
	$('status').hidden = !msg;

function meterHtml(r) {
	if (!r.teeTimes.length) return '';
	return '<div class="meter" aria-hidden="true">' + r.teeTimes.map(t => {
		const ps = playersAt(r, t.id);
		let dots = '';
		for (let i = 0; i < Math.max(t.spots, ps.length); i++) {
			const p = ps[i];
			dots += `<span class="dot ${i >= t.spots ? 'over' : p ? p.status : ''}"></span>`;
		}
		return `<span class="meter-group">${dots}</span>`;
	}).join('') + '</div>';
}

function cardHtml(r, past) {
	const c = counts(r);
	const chips = [
		c.in ? `<span class="chip in">${c.in} in</span>` : '',
		c.pending ? `<span class="chip pending">${c.pending} pending</span>` : '',
		c.out ? `<span class="chip out">${c.out} out</span>` : '',
	].join('');
	const tentative = r.tentative && !past;
	return `<button class="card${past ? ' past' : ''}${tentative ? ' tentative' : ''}${tentative && bookDue(r) ? ' due' : ''}" data-action="open" data-id="${esc(r.id)}">
		<span class="cal">
			<span class="cal-dow">${esc(fmtDate(r.date, {weekday: 'short'}).toUpperCase())}</span>
			<span class="cal-day">${parseDate(r.date).getDate()}</span>
			<span class="cal-mon">${esc(fmtDate(r.date, {month: 'short'}).toUpperCase())}</span>
		</span>
		<span class="card-body">
			${tentative ? `<span class="card-flag">${tentativeLabel(r)}</span>` : ''}
			<span class="card-top"><span class="card-title">${esc(r.course)}</span><span class="card-when">${esc(relDay(r.date))}</span></span>
			${r.teeTimes.length
				? `<span class="card-times">${esc(fmtTimes(r.teeTimes))}<span class="card-holes">${r.holes} holes</span></span>`
				: `<span class="card-times none">No tee times yet · ${r.holes} holes</span>`}
			${past ? '' : meterHtml(r)}
			${chips ? `<span class="counts">${chips}</span>` : ''}
		</span>
	</button>`;
}

function renderList() {
	$('top').innerHTML = `<div class="brand">Tee Sheet<small>${esc(fmtDate(todayStr(), {weekday: 'long', month: 'long', day: 'numeric'}))}</small></div><button class="link-btn" data-action="regulars">Golfers</button>`;
	const today = todayStr();
	const upcoming = rounds.filter(r => r.date >= today).sort(byWhen);
	const past = rounds.filter(r => r.date < today).sort((a, b) => byWhen(b, a));
	const waiting = upcoming.reduce((n, r) => n + counts(r).pending, 0);
	let html = '';
	if (!loaded) {
		html += '<div class="empty"><strong>Loading your rounds…</strong></div>';
	} else if (!upcoming.length) {
		html += `<div class="section-label">Upcoming</div><div class="empty"><strong>No rounds on the books</strong></div>`;
	} else {
		html += `<div class="section-label"><span>Upcoming · ${upcoming.length}</span>${waiting ? `<span class="chip pending">Waiting on ${waiting}</span>` : ''}</div>`;
		html += `<div class="cards">${upcoming.map(r => cardHtml(r, false)).join('')}</div>`;
	}
	if (past.length) {
		html += `<div class="section-label"><span>Played · ${past.length}</span><button data-action="toggle-past" aria-expanded="${showPast}">${showPast ? 'Hide' : 'Show'}</button></div>`;

function noteHtml(p) {

const IS_APPLE = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);

function dropZone(status, label) {

function openSlot(teeId, label) {

function bookDue(r) {
	return r.tentative && !!r.bookOn && daysUntil(r.bookOn) <= 0;
}
function tentativeLabel(r) {
	if (!r.bookOn) return 'Tentative';
	if (bookDue(r)) return 'Tentative · Book now';
	return `Tentative · Book ${fmtDate(r.bookOn, {month: 'short', day: 'numeric'})}`;
}
function bookingCard(r) {

		if (n > 1) when = `Book on ${day} · in ${n} days`;
		else if (n === 1) when = `Book tomorrow, ${day}`;
		else if (n === 0) when = '<b>Book today</b>';
		else when = `<b>Booking opened ${day}</b>`;
	}
	return `<div class="booking-card${bookDue(r) ? ' due' : ''}">
		<div class="booking-text">

function renderRound(r) {
	const c = counts(r);
	$('top').innerHTML = `<button class="back" data-action="back">${icoBack}Tee Sheet</button>`;
	let html = `<div class="round-head">
			<div class="round-title">
				<h1 class="course">${esc(r.course)}</h1>
				<p class="when">${esc(fmtDate(r.date, {weekday: 'long', month: 'long', day: 'numeric'}))} · ${r.holes} holes · ${esc(relDay(r.date))}</p>
			</div>
			<div class="head-actions">
				<button class="edit-btn icon-only${r.shareToken ? ' is-on' : ''}" data-action="share-round" aria-label="${r.shareToken ? 'Shared. Manage link' : 'Share round'}">${icoShare}</button>
				<button class="edit-btn" data-action="edit-round" aria-label="Edit round">${icoPencil}Edit</button>
			</div>
		</div>
		${r.tentative ? bookingCard(r) : ''}
		${r.notes ? `<p class="notes">${esc(r.notes)}</p>` : ''}
		<div class="summary">
			<div class="stat in"><b>${c.in}</b><span>In</span></div>
			<div class="stat pending"><b>${c.pending}</b><span>Pending</span></div>
			<div class="stat out"><b>${c.out}</b><span>Out</span></div>
			<div class="stat${c.open < 0 ? ' over' : ''}"><b>${c.spots ? Math.abs(c.open) : '–'}</b><span>${c.open < 0 ? 'Over' : 'Open'}</span></div>
		</div>`;

	r.teeTimes.forEach(t => {
		const ps = playersAt(r, t.id);
		const {clock, mer} = splitTime(t.time);
		const over = ps.length > t.spots;
		let open = '';
		for (let i = ps.length; i < t.spots; i++) {
			open += openSlot(t.id, 'Open spot');
		}
		html += `<section class="tee" data-drop-status="in" data-drop-tee="${esc(t.id)}" data-full="${ps.length >= t.spots}" aria-label="${esc(fmtTime(t.time))} tee time">
			<div class="tee-head">
				<button class="tee-time" data-action="edit-tee" data-tee="${esc(t.id)}" aria-label="Change the ${esc(fmtTime(t.time))} tee time">${clock}<small>${mer}</small><span class="tee-edit-icon">${icoPencil}</span></button>
				<span class="tee-fill${over ? ' over' : ''}">${over ? `${ps.length} booked, max ${t.spots}` : `${ps.length} of ${t.spots}`}${meterHtml({teeTimes: [t], players: ps})}</span>
				<button class="tee-remove${armedTee === t.id ? ' armed' : ''}" data-action="remove-tee" data-tee="${esc(t.id)}" aria-label="Remove the ${esc(fmtTime(t.time))} tee time">${armedTee === t.id ? 'Remove?' : icoRemove}</button>
			</div>
			<ul class="slots">${ps.map(p => playerRow(r, p)).join('')}${open}</ul>
		</section>`;
	});

	html += '<button class="dashed-btn add-tee-btn" data-action="add-tee">+ Add tee time</button>';

	const teeIds = new Set(r.teeTimes.map(t => t.id));
	const unassigned = r.players.filter(p => p.status === 'in' && !teeIds.has(p.teeTimeId)).sort(byStatusThenLeague);
	if (unassigned.length || !r.teeTimes.length) {
		html += `<section class="tee" data-drop-status="in" data-drop-tee=""><div class="tee-head"><span class="tee-label">${r.teeTimes.length ? 'No tee time yet' : 'Playing'}</span><span class="tee-fill">${unassigned.length}</span></div>
			<ul class="slots">${unassigned.map(p => playerRow(r, p)).join('')}${!unassigned.length ? openSlot('', 'Add golfers') : ''}</ul></section>`;
	} else {
		html += dropZone('in', 'No tee time yet');
	}

	const pending = r.players.filter(p => p.status === 'pending').sort(byStatusThenLeague);
	if (pending.length) {
		html += `<section class="tee" data-drop-status="pending"><div class="tee-head"><span class="tee-label">Waiting to hear back</span><span class="tee-fill">${pending.length}</span></div>
			<ul class="slots">${pending.map(p => playerRow(r, p)).join('')}</ul></section>`;
	} else {
		html += dropZone('pending', 'Waiting to hear back');
	}

	const out = r.players.filter(p => p.status === 'out');
	if (out.length) {
		html += `<section class="tee" data-drop-status="out"><div class="tee-head"><span class="tee-label">Can’t make it</span><span class="tee-fill">${out.length}</span></div>
			<ul class="slots">${out.map(p => playerRow(r, p)).join('')}</ul></section>`;
	} else {
		html += dropZone('out', 'Can’t make it');
	}

	$('main').innerHTML = html;
	$('barInner').innerHTML = '<button class="primary" data-action="invite-players">Invite golfers</button>';
	$('bar').hidden = false;
}

function addNewName() {
	const input = $('f-name');
	const name = input.value.trim().replace(/\s+/g, ' ');
	if (!name) return true;
	const r = findRound(sheet.roundId);
	const existing = activeRegulars().find(g => sameName(g.name, name));
	const onIt = r.players.find(p => (existing ? regularFor(p)?.id === existing.id : sameName(displayName(p), name)));
	if (onIt && (sheet.addTo === undefined || onIt.status === 'in')) {
		showErr(`${name} is already on this round.`);
		return false;
	}
	$('formErr').hidden = true;
	if (existing) {
		sheet.selected.add(existing.id);
		const row = $('pickList')?.querySelector(`.pick-row[data-gid="${CSS.escape(existing.id)}"]`);
		row?.classList.add('on');
		row?.setAttribute('aria-pressed', 'true');
	} else if (!sheet.newNames.some(n => sameName(n, name))) {
		sheet.newNames.push(name);
	}
	input.value = '';
	input.focus();
	sheet.dirty = true;
	updateInvitePanel();
	return true;
}
function updateInvitePanel() {
	const count = sheet.selected.size + sheet.newNames.length;
	const verb = sheet.addTo !== undefined ? 'Add' : 'Invite';
	$('inviteBtn').textContent = count ? `${verb} ${count}` : verb;
	$('inviteBtn').disabled = !count;
	const chip = (attrs, name) => `<button type="button" class="pick-chip" ${attrs} aria-label="Remove ${esc(name)}">${esc(name)}<span aria-hidden="true">×</span></button>`;
	$('pickedStrip').hidden = !count;
	$('pickedStrip').innerHTML = [
		...regulars.filter(g => sheet.selected.has(g.id)).map(g => chip(`data-action="toggle-pick" data-gid="${esc(g.id)}"`, g.name)),
		...sheet.newNames.map(n => chip(`data-action="remove-new-name" data-name="${esc(n)}"`, n)),
	].join('');
}
function invitePlayersSheet() {
	const r = findRound(sheet.roundId);
	const stats = golferStats();
	const available = pickCandidates(r, stats);
	const tee = r.teeTimes.find(t => t.id === sheet.addTo);
	const title = sheet.addTo === undefined ? 'Invite golfers' : tee ? `Add to ${fmtTime(tee.time)}` : 'Add golfers';
	let list = '';
	if (available.length) list = `<section class="list-card picker"><ul class="slots" id="pickList">${pickRows(r, available, stats)}</ul></section>`;
	else if (regulars.length) list = '<p class="hint">All your golfers are already on this round.</p>';
	return sheetHead(title) + `<form class="form" id="invitePlayersForm" novalidate>
		<button type="button" class="dashed-btn" id="showNewBtn" data-action="show-new-person"${available.length ? '' : ' hidden'}>+ New golfer</button>
		<div class="field" id="newPerson"${available.length ? ' hidden' : ''}><label for="f-name">New golfer</label><div class="new-row"><input class="input" id="f-name" autocomplete="off" autocapitalize="words" enterkeyhint="enter" placeholder="Name"><button type="button" class="secondary" data-action="add-new-name">Add</button></div></div>
		<p class="err" id="formErr" hidden></p>
		${available.length > 8 ? '<input class="input" type="search" id="f-search" placeholder="Search golfers" autocomplete="off" aria-label="Search golfers">' : ''}
		${list}
		<div class="sheet-actions sticky"><div class="picked" id="pickedStrip" hidden></div><button class="primary" type="submit" id="inviteBtn" disabled>${sheet.addTo === undefined ? 'Invite' : 'Add'}</button></div>
	</form>`;
}
function submitInvitePlayers() {
	const r = findRound(sheet.roundId);
	const adding = sheet.addTo !== undefined;
	if (!addNewName()) return;
	const picked = activeRegulars().filter(g => sheet.selected.has(g.id));
	sheet.newNames.forEach(name => {
		let g = regulars.find(x => sameName(x.name, name));
		if (!g || g.archived) {
			g = g ? {...g, archived: false} : {id: uid(), name, league: false};
			saveDoc('regulars', g);
		}
		if (!picked.some(x => x.id === g.id)) picked.push(g);
	});
	if (!picked.length) return;
	if (adding) {
		const tee = r.teeTimes.find(t => t.id === sheet.addTo);
		let placed = 0;
		editRound(r.id, x => picked.forEach(g => {
			let p = x.players.find(y => regularFor(y)?.id === g.id);
			if (!p) {
				p = {id: uid(), name: g.name, regularId: g.id};
				x.players.push(p);
			}
			const room = tee && playersAt(x, tee.id).length < tee.spots;
			p.status = 'in';
			p.teeTimeId = room ? tee.id : '';
			if (room) placed++;
		}));
		closeSheet();
		const where = tee && placed === picked.length ? fmtTime(tee.time) : 'the round';
		toast(picked.length === 1 ? `${picked[0].name}: In · ${where === 'the round' ? 'no tee time yet' : where}` : `Added ${picked.length} golfers to ${where}`);
		return;
	}
	const pids = picked.map(() => uid());
	editRound(r.id, x => picked.forEach((g, n) => {
		x.players.push({id: pids[n], name: g.name, regularId: g.id, status: 'pending', teeTimeId: ''});
	}));
	openSheet('send-invites', {roundId: r.id, pids, sent: new Set(), text: inviteText(findRound(r.id))});
}

function rerenderSheet() {
	if (!sheet) return;
	const scroll = $('sheet').scrollTop;
	$('sheet').innerHTML = sheetHtml();
	$('sheet').scrollTop = scroll;
}
function showErr(msg) {

	el.hidden = false;
}

function spotOptions(current) {

}
function readRoundTimes() {
	$('sheet').querySelectorAll('[data-time-id]').forEach(inp => {
		const t = sheet.times.find(x => x.id === inp.dataset.timeId);
		if (t) t.time = inp.value;
	});
	$('sheet').querySelectorAll('[data-spots-id]').forEach(sel => {
		const t = sheet.times.find(x => x.id === sel.dataset.spotsId);
		if (t) t.spots = Number(sel.value);
	});
}
function keepRoundDraft() {
	sheet.draft = {
		course: $('f-course').value,
		date: $('f-date').value,
		notes: $('f-notes').value,
		tentative: $('bk-tentative').checked,
		bookOn: $('f-bookon').value,
		holes: $('h-9').checked ? 9 : 18,
	};
}
function restoreRoundDraft() {
	if (!sheet.draft) return;
	$('f-course').value = sheet.draft.course;
	$('f-date').value = sheet.draft.date;
	$('f-notes').value = sheet.draft.notes;
	$(sheet.draft.tentative ? 'bk-tentative' : 'bk-booked').checked = true;
	$('bookOnField').hidden = !sheet.draft.tentative;
	$('f-bookon').value = sheet.draft.bookOn;
	$(sheet.draft.holes === 9 ? 'h-9' : 'h-18').checked = true;
}

function submitRound() {
	readRoundTimes();
	const course = $('f-course').value.trim();
	const date = $('f-date').value;
	if (!course) return showErr('Add the course name.');
	if (!date) return showErr('Pick a date.');
	const notes = $('f-notes').value.trim();
	const holes = $('h-9').checked ? 9 : 18;
	const tentative = $('bk-tentative').checked;
	const bookOn = tentative ? $('f-bookon').value : '';
	if (sheet.roundId) {
		editRound(sheet.roundId, r => {
			r.course = course;
			r.date = date;
			r.holes = holes;
			r.notes = notes;
			r.tentative = tentative;
			r.bookOn = bookOn;
		});
		closeSheet();
		toast('Round updated');
		return;
	}
	const teeTimes = sheet.times.filter(t => t.time).map(t => ({id: t.id, time: t.time, spots: t.spots}));
	const sorted = [...teeTimes].sort((a, b) => a.time.localeCompare(b.time));
	const players = [{id: uid(), name: OWNER_NAME, status: 'in', teeTimeId: sorted[0]?.id ?? ''}];
	const round = {id: uid(), course, date, holes, notes, tentative, bookOn, teeTimes, players};
	saveDoc('rounds', round);
	closeSheet();
	view = {name: 'round', roundId: round.id};
	render();
	window.scrollTo(0, 0);
}


function submitEditPlayer() {
	const r = findRound(sheet.roundId);
	const player = r.players.find(p => p.id === sheet.pid);
	const g = regularFor(player);
	const name = $('f-name') ? $('f-name').value.trim() : player.name;
	if (!name) return showErr('Add a name.');
	if (r.players.some(p => p.id !== sheet.pid && sameName(displayName(p), name))) return showErr(`${name} is already on this round.`);
	const status = $('sheet').querySelector('input[name="status"]:checked')?.value;
	const note = $('f-note').value.trim();
	if (g) {
		const golferNote = $('f-gnote').value.trim();
		if (golferNote !== g.note) saveDoc('regulars', {...g, note: golferNote});
	}
	editRound(r.id, x => {
		const p = x.players.find(y => y.id === sheet.pid);
		Object.assign(p, {name, note});
		if (status !== p.status) setStatus(p, status);
	});
