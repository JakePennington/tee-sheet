# Free Supabase projects pause after about a week without requests. This pings the
# project twice a week so it stays awake through the off-season.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the Supabase API
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js)
          key=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" config.js)
          curl -fsS "$url/rest/v1/rounds?select=id&limit=1" -H "apikey: $key" -o /dev/null
          echo "Pinged $url"
